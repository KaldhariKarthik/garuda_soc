ips:
  - name: apb_spi_master
    dir: pulp/apb_spi_master
    upstream: https://github.com/pulp-platform/apb_spi_master
    commit: 3fce81084b15870f4bd9da7806cf950774f9672e
    commit_date: "2018-06-21"
    vendored: "2026-09-22"
    spdx: SHL-0.51
    copyright: ETH Zurich and University of Bologna
    used_for: >-
      Block 13 spi_master (boot flash + IMU), behind rtl/spi_master/garuda_spim_top.v.
      PREADY is tied high upstream, which is what makes it usable with our
      16-pclk bridge timeout.

  - name: axi_spi_master
    dir: pulp/axi_spi_master
    upstream: https://github.com/pulp-platform/axi_spi_master
    commit: ee219078353a76e468674c25675f5b7fe5f51127
    commit_date: "2018-06-21"
    vendored: "2026-09-22"
    spdx: SHL-0.51
    copyright: ETH Zurich and University of Bologna
    used_for: >-
      The SPI datapath that apb_spi_master symlinks to upstream (clkgen,
      controller, fifo, rx, tx). Vendored as real files because a symlink
      across repositories does not survive vendoring.

  - name: apb_uart_sv
    dir: pulp/apb_uart_sv
    upstream: https://github.com/pulp-platform/apb_uart_sv
    commit: dfad6e04d19cc9481d3cd2750b45b970dc61271b
    commit_date: "2017-08-03"
    vendored: "2026-09-22"
    spdx: SHL-0.51
    copyright: ETH Zurich and University of Bologna
    used_for: >-
      Blocks 16/17/18 uart0/1/2, behind rtl/uart/garuda_uart_top.v. 16550
      register model: byte-addressed (PADDR[2:0]), so the wrapper re-maps our
      word offsets onto it.

  - name: apb_gpio
    dir: pulp/apb_gpio
    upstream: https://github.com/pulp-platform/apb_gpio
    commit: f82caeb7f7d89427f05e9af5ed31e0675efe0d83
    commit_date: "2021-05-10"
    vendored: "2026-09-22"
    spdx: SHL-0.51
    copyright: ETH Zurich and University of Bologna
    used_for: >-
      Block 19 gpio, behind rtl/gpio/garuda_gpio_top.v. Already 32-bit
      word-aligned with input synchronisers.

  - name: opencores_i2c
    dir: opencores/i2c
    upstream: https://github.com/pulp-platform/apb_i2c
    commit: 84855413cc2c8e70209ee7f168a0225d3c5914a1
    commit_date: "2016-02-17"
    vendored: "2026-09-22"
    spdx: "OpenCores permissive (notice-preserving; see each file header)"
    copyright: "Richard Herveille, 2001 - www.opencores.org/projects/i2c"
    used_for: >-
      Block 15 i2c: the bit and byte controllers only. PULP's apb_i2c.sv
      register front end carries NO licence header and that repository has no
      LICENSE file, so it is deliberately NOT vendored - rtl/i2c/garuda_i2c_top.v
      implements our own register layer instead (D-22). The controllers
      themselves carry Richard Herveille's notice, which must be preserved.
