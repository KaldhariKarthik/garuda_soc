[[waiver]]
id       = "CL-HSTATE"
metric   = "line"
file     = "rtl/ahb2apb/brg_ahb_fsm.sv"
match    = "^line:92 case"
category = "unreachable"
reason   = "The hclk FSM's 3-bit state uses six codes (H_IDLE..H_ERR2); the `default:` arm recovers the two unused codes, which no transition produces."
evidence = "PROVEN fv_apb apb_prove + fv_apb_div div_prove a_hstate_legal (hstate <= 5), abc pdr, 2026-10-14"
reviewer = "pending: Karthik"

[[waiver]]
id       = "CL-ERR2HOLD"
metric   = "line"
file     = "rtl/ahb2apb/brg_ahb_fsm.sv"
match    = "^line:58 elsif"
category = "unreachable"
reason   = "Since BRG-3 the bridge enters H_ERR2 only with the APB side out of reset (H_ERR1 waits for prst_ok). prst_ok can then fall only if PRESET asserts while HRESET does not, and reset_ctrl asserts both from the same request flop (and releases PRESET after HRESET); an HRESET resets the bridge itself. The hold of the second ERROR cycle is kept as a safeguard."
evidence = "literal rtl/ahb2apb/brg_ahb_fsm.sv H_ERR1 (hstate_next = H_ERR2 only if prst_ok_i); rtl/reset_ctrl/reset_ctrl.sv p_hrst and p_prst both set by sys_req_q, prst_q follows hrst_q[1]"
reviewer = "pending: Karthik"

[[waiver]]
id       = "CE-ERR2HOLD"
metric   = "expr"
file     = "rtl/ahb2apb/brg_ahb_fsm.sv"
match    = "^line:58 \\(prst_ok_i==0 && \\(hstate == H_ERR2\\)==1\\) => 1"
category = "unreachable"
reason   = "Same condition as CL-ERR2HOLD: H_ERR2 with the APB side in reset cannot occur."
evidence = "as CL-ERR2HOLD"
reviewer = "pending: Karthik"

