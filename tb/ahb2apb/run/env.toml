# AHB-to-APB bridge environment (Track A bus plan B2): tb/ahb2apb/env/tb_apb_env.sv.
# Real clk_div + bridge, the B1 AHB master agent, twelve APB targets each with an APB
# checker, a scoreboard from garuda_map_pkg, ahb2apb_sva and ahb2apb_cov bound.
# APB-1 (open ruling) is a counted exception inside the bench ([KNOWN APB-1] line).
# Run: make -f flow/mk/track_a_run.mk apb_env
[suite]
block = "ahb2apb"
name  = "env"
kind  = "sim"
xfail = "tb/ahb2apb/run/xfail.tsv"

[defaults]
flist   = "tb/ahb2apb/env/filelist_apb_env.f"
top     = "tb_apb_env"
marker  = '^RESULT: PASSED'
timeout = 1800

[[test]]
name     = "env_smoke"
plusargs = ["+TEST=smoke"]

[[test]]
name     = "env_windows"
plusargs = ["+TEST=windows"]

[[test]]
name     = "env_waits"
plusargs = ["+TEST=waits"]

[[test]]
name     = "env_b2b"
plusargs = ["+TEST=b2b"]

[[test]]
name     = "env_reject"
plusargs = ["+TEST=reject"]

[[test]]
name     = "env_aperture"
plusargs = ["+TEST=aperture"]

[[test]]
name     = "env_timeout"
plusargs = ["+TEST=timeout"]

[[test]]
name     = "env_slverr"
plusargs = ["+TEST=slverr"]

[[test]]
name     = "env_phase"
plusargs = ["+TEST=phase"]

[[test]]
name     = "env_reset"
plusargs = ["+TEST=reset"]

[[test]]
name     = "env_random"
plusargs = ["+TEST=random"]

[[test]]
name     = "env_skew"
plusargs = ["+TEST=skew"]

[[test]]
name     = "env_toggle"
plusargs = ["+TEST=toggle"]

# every directed test in one run (the planted-defect baseline)
[[test]]
name     = "env_mut_baseline"
plusargs = ["+TEST=mut"]

# every divider in use: /1 /2 /4 /8 across the twelve windows
[[test]]
name     = "env_div"
plusargs = ["+TEST=div"]
defines  = ["APB_ENV_DIV=24'hE4E4E4"]

[[test]]
name     = "env_div_random"
plusargs = ["+TEST=random"]
defines  = ["APB_ENV_DIV=24'hE4E4E4"]

# the chip's mask with the SPI slave absent (WITH_SPI_SLAVE = 0): window 0 must error
[[test]]
name     = "env_mask_nospis"
plusargs = ["+TEST=random"]
defines  = ["APB_ENV_MASK=16'h0FFE"]

# the real DMA register bank on window 5 (Fresh plan Phase 2 "real DMA config window")
[[test]]
name     = "env_real_dma"
plusargs = ["+TEST=real_dma"]
defines  = ["APB_ENV_REAL_DMA"]

[[test]]
name     = "env_real_dma_smoke"
plusargs = ["+TEST=smoke"]
defines  = ["APB_ENV_REAL_DMA"]

[[test]]
name        = "negctl_sb_drop"
plusargs    = ["+TEST=random", "+INJECT=drop"]
fail_reason = '^\[FAIL\] \[SB\]'

[[test]]
name        = "negctl_sb_rdata"
plusargs    = ["+TEST=random", "+INJECT=rdata"]
fail_reason = '^\[FAIL\] \[SB\]'

[[test]]
name        = "negctl_sb_dup"
plusargs    = ["+TEST=random", "+INJECT=dup"]
fail_reason = '^\[FAIL\] \[SB\]'

# the real DMA register bank on a /8 window: PENABLE held after PREADY must still give
# exactly ONE register write per APB write (dma_sva a_strobe_once) and the right read data
[[test]]
name     = "env_real_dma_div8"
plusargs = ["+TEST=real_dma"]
defines  = ["APB_ENV_REAL_DMA", "APB_ENV_DIV=24'h000C00"]

# the planted-defect baseline with every divider in use (tb/ahb2apb/run/apb_mut.toml builds this way)
[[test]]
name     = "env_mut_baseline_div"
plusargs = ["+TEST=mut"]
defines  = ["APB_ENV_DIV=24'hE4E4E4"]
