# Plan 5.4: riscv-arch-test 3.10.0 on GARUDA, signatures against Spike.
# GENERATED by tools/archtest/build_archtest.py -- do not edit by hand.
# Run: make -f flow/mk/track_a.mk core_archtest
[suite]
block = "core"
name  = "archtest"
kind  = "prog"
xfail = "tb/core/run/xfail.tsv"

[bench]
flist = "tb/soc/filelist_boot_mem2m.f"
