# CSR existence sweep on tb_boot: all 4096 addresses read once (tools/csr_map.py).
# The image is generated by `make -f flow/mk/track_a.mk core_csr_map`, which
# then runs Spike and compares both against Design_Docs/regs/core_csr.yaml.
[suite]
block = "core"
name  = "csr_map"
kind  = "prog"
xfail = "tb/core/run/xfail.tsv"

[bench]
flist = "tb/soc/filelist_boot.f"
cov_flist = "tb/soc/filelist_boot_cov.f"   # --coverage: + bound covergroups (tb/cov/garuda_cov.sv)
top   = "tb_boot"

[defaults]
marker   = 'TOHOST=1 -> PASSED'
timeout  = 600
require  = ['AHB-PROTOCOL: iport=0 dport=0']


[[test]]
name = "csr_sweep"
hex  = "logs/core/raw/csrmap_img/csr_sweep.hex"
plusargs = ["+MAXCYC=400000", "+QUIET"]
