# Plan 5.10: stress over seeds. GENERATED by tools/gen/gen_stress_manifest.py
# --seeds 1000 -- do not edit by hand. Row = seed; all choices from Random(seed).
# Run: make -f flow/mk/track_a_run.mk core_stress
[suite]
block = "core"
name  = "stress"
kind  = "prog"
xfail = "tb/core/run/xfail.tsv"

[bench]
flist = "tb/soc/filelist_boot_cosim.f"
top   = "tb_boot"
vl_flags = ["-CFLAGS", "-I$GARUDA_TOOLS/spike/include", "-LDFLAGS", "-L$GARUDA_TOOLS/spike/lib -lriscv -Wl,-rpath,$GARUDA_TOOLS/spike/lib"]

[defaults]
marker   = 'TOHOST=1 -> PASSED'
timeout  = 900
require  = ['AHB-PROTOCOL: iport=0 dport=0', 'COSIM: .* 0 mismatches']

[[test]]
name = "t_core_ctl_s2"
hex  = "sw/build/t_core_ctl.hex"
