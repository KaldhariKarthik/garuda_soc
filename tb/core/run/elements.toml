# Core element benches (14, garuda_tb_pkg scoreboard). Same filelists and tops
# as Makefile run_tb_elem (Makefile:173-206).
# Run: make -f flow/mk/track_a_run.mk core_elements
[suite]
block = "core"
name  = "elements"
kind  = "sim"
xfail = "tb/core/run/xfail.tsv"

[defaults]
top    = "tb_top"
marker = 'ALL CHECKS PASSED|^ RESULT: PASSED'
timeout = 900

# Declared Verilator-only deviation (applied to a generated copy, never to the
# repo file; the copy must differ in exactly one line carrying the marker).
# Verilator 5.052 segfaults in the front end on
#     sb.summary(<handle>.get_coverage());
# (bisected on tb_alu in the audit). Reading the value into a local first is
# the same call, same value, same order. Removed when E7 rewrites the benches.
[[shim]]
id = "SHIM-SB-SUMMARY"
glob = "tb/core/tb_*.sv"
match = '^(\s*)sb\.summary\(([a-z_.0-9]+\.get_coverage\(\))\);'
replace = '\1begin real shim_cov; shim_cov = \2; sb.summary(shim_cov); end  // shim:SHIM-SB-SUMMARY'
lines = 1
