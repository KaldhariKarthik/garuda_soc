# bring-up of the co-simulation on a few programs (not a regression suite)
[suite]
block = "core"
name  = "cosim_smoke"
kind  = "prog"
[bench]
flist = "tb/soc/filelist_boot_cosim.f"
top   = "tb_boot"
vl_flags = ["-CFLAGS", "-I$GARUDA_SPIKE/include", "-LDFLAGS", "-L$GARUDA_SPIKE/lib -lriscv -Wl,-rpath,$GARUDA_SPIKE/lib"]
[defaults]
marker   = 'TOHOST=1 -> PASSED'
timeout  = 300
require  = ['AHB-PROTOCOL: iport=0 dport=0', 'COSIM: .* 0 mismatches']
[[test]]
name = "add"
hex  = "sw/riscv-tests/build/add.hex"
plusargs = ["+MAXCYC=400000", "+QUIET"]
