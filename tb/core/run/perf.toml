# P0.11 throughput: tb_boot speed on t_perf_mix (about 1 M instructions) with no
# waits, fixed waits, random waits, and in lockstep with Spike. A normal build.
# Run: make -f flow/mk/track_a_run.mk throughput_a
[suite]
block = "core"
name  = "perf"
kind  = "prog"
xfail = "tb/core/run/xfail.tsv"

[bench]
flist = "tb/soc/filelist_boot.f"
cov_flist = "tb/soc/filelist_boot_cov.f"   # --coverage: + bound covergroups (tb/cov/garuda_cov.sv)
top   = "tb_boot"


[defaults]
marker   = 'TOHOST=1 -> PASSED'
timeout  = 1800
require  = ['AHB-PROTOCOL: iport=0 dport=0']

[[test]]
name = "perf_nowait"
hex  = "sw/build/t_perf_mix.hex"
plusargs = ["+MAXCYC=20000000", "+QUIET"]
[[test]]
name = "perf_w2"
hex  = "sw/build/t_perf_mix.hex"
plusargs = ["+MAXCYC=40000000", "+QUIET", "+IWAIT=2", "+DWAIT=2"]
[[test]]
name = "perf_rand"
hex  = "sw/build/t_perf_mix.hex"
plusargs = ["+MAXCYC=80000000", "+QUIET", "+IWAIT=8", "+DWAIT=8", "+IRAND=1", "+DRAND=1", "+SEED=3"]
[[test]]
name = "perf_lockstep"
hex  = "sw/build/t_perf_mix.hex"
plusargs = ["+MAXCYC=20000000", "+QUIET"]
lockstep = true
