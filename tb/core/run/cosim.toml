# Plan 5.2 / 5.3: the core in step with Spike (tools/cosim/garuda_cosim.cc),
# one comparison per retired instruction, interrupts applied from the spec.
# GENERATED by tools/gen/gen_cosim_manifest.py -- do not edit by hand.
# Run: make -f flow/mk/track_a.mk core_cosim
[suite]
block = "core"
name  = "cosim"
kind  = "prog"
xfail = "tb/core/run/xfail.tsv"

[bench]
flist = "tb/soc/filelist_boot_cosim.f"
top   = "tb_boot"
vl_flags = ["-CFLAGS", "-I$GARUDA_TOOLS/spike/include", "-LDFLAGS", "-L$GARUDA_TOOLS/spike/lib -lriscv -Wl,-rpath,$GARUDA_TOOLS/spike/lib"]

[defaults]
marker   = 'TOHOST=1 -> PASSED'
timeout  = 900
require  = ['AHB-PROTOCOL: iport=0 dport=0', 'COSIM: .* 0 mismatches']

[[programs]]
glob = "sw/riscv-tests/build/*.hex"
plusargs = ["+MAXCYC=100000", "+QUIET"]

[[test]]
name = "cs_t_loadbranch"
hex  = "sw/build/t_loadbranch.hex"
plusargs = ["+MAXCYC=200000", "+QUIET"]

[[test]]
name = "cs_t_flush"
hex  = "sw/build/t_flush.hex"
plusargs = ["+MAXCYC=200000", "+QUIET", "+IWAIT=3", "+IRAND=1", "+SEED=7"]

[[test]]
name = "cs_t_buserr"
hex  = "sw/build/t_buserr.hex"
plusargs = ["+MAXCYC=200000", "+QUIET", "+ERR_EN=1", "+ERR_BASE=10020000", "+ERR_SIZE=1000"]

