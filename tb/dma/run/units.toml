# DMA sub-module benches (Track A wrap-up 2026-10-12): dma_apb_slave, dma_chan and
# dma_engine each on their own, against references written from GARUDA-DMA-SPEC-001
# and the rulings (not from the RTL). Open defects are named in each bench.
# Run: make -f flow/mk/track_a.mk dma_units
[suite]
block = "dma"
name  = "units"
kind  = "sim"
xfail = "tb/dma/run/xfail.tsv"

[defaults]
marker  = '^RESULT: PASSED'
timeout = 900
cwd     = "root"

[[test]]
name  = "tb_dma_apb_slave_unit"
flist = "tb/dma/units/tb_dma_apb_slave_unit.f"
top   = "tb_dma_apb_slave_unit"

[[test]]
name  = "tb_dma_chan_unit"
flist = "tb/dma/units/tb_dma_chan_unit.f"
top   = "tb_dma_chan_unit"

[[test]]
name  = "tb_dma_engine_unit"
flist = "tb/dma/units/tb_dma_engine_unit.f"
top   = "tb_dma_engine_unit"

# negative controls: each unit bench must catch planted defects of its module (XFAIL PLANTED;
# mutants generated by tools/gen/gen_dma_mutants.py)
[[test]]
name    = "negctl_apb_double_strobe"
flist   = "tb/dma/units/tb_dma_apb_slave_unit.f"
top     = "tb_dma_apb_slave_unit"
replace = { "rtl/dma/dma_apb_slave.v" = "tb/dma/mut/dma_apb_slave_mut_m20.v" }
fail_reason = '^\[FAIL\] write .*: 2 strobe'
[[test]]
name    = "negctl_apb_aud13"
flist   = "tb/dma/units/tb_dma_apb_slave_unit.f"
top     = "tb_dma_apb_slave_unit"
replace = { "rtl/dma/dma_apb_slave.v" = "tb/dma/mut/dma_apb_slave_mut_m21.v" }
fail_reason = '^\[FAIL\] write 010: PSLVERR 1'
[[test]]
name    = "negctl_chan_d2"
flist   = "tb/dma/units/tb_dma_chan_unit.f"
top     = "tb_dma_chan_unit"
replace = { "rtl/dma/dma_chan.v" = "tb/dma/mut/dma_chan_mut_m01.v" }
fail_reason = '^\[FAIL\] cycle'
[[test]]
name    = "negctl_chan_half_step"
flist   = "tb/dma/units/tb_dma_chan_unit.f"
top     = "tb_dma_chan_unit"
replace = { "rtl/dma/dma_chan.v" = "tb/dma/mut/dma_chan_mut_m05.v" }
fail_reason = '^\[FAIL\] cycle'
[[test]]
name    = "negctl_engine_eng1"
flist   = "tb/dma/units/tb_dma_engine_unit.f"
top     = "tb_dma_engine_unit"
replace = { "rtl/dma/dma_engine.v" = "tb/dma/mut/dma_engine_mut_m15.v" }
fail_reason = '^\[FAIL\] ENG-1'
[[test]]
name    = "negctl_engine_ack_width"
flist   = "tb/dma/units/tb_dma_engine_unit.f"
top     = "tb_dma_engine_unit"
replace = { "rtl/dma/dma_engine.v" = "tb/dma/mut/dma_engine_mut_m14.v" }
fail_reason = 'ack high 1 hclk, expected 2'
[[test]]
name    = "negctl_engine_lane0"
flist   = "tb/dma/units/tb_dma_engine_unit.f"
top     = "tb_dma_engine_unit"
replace = { "rtl/dma/dma_engine.v" = "tb/dma/mut/dma_engine_mut_m17.v" }
fail_reason = 'wrote lane .* read lane'
