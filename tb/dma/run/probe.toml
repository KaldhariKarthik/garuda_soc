# DMA defect reproducers (Track A, DMA plan D1): tb/dma/tb_dma_probe.sv, one row per
# case. Each case checks the specified behaviour, so it failed while its defect was open
# (xfail with the bug ID) and passes once fixed. Since the DMA rulings (branch
# a/dma-rulings, 2026-11-01) every row passes and is a regression test; the comment on
# each row says how it failed before. The formal negative controls of the fixed defects
# are the mut_dma*_revert tasks in tb/dma/formal/dma.toml.
# Run: make -f flow/mk/track_a_run.mk dma_probe
[suite]
block = "dma"
name  = "probe"
kind  = "sim"
xfail = "tb/dma/run/xfail.tsv"

[defaults]
flist   = "tb/dma/filelist_dma_probe.f"
top     = "tb_dma_probe"
marker  = '^RESULT: PASSED'
timeout = 600

[[test]]
name     = "probe_dma9"
# fixed 2026-11-01 (DMA-11 ruling: before, the case expected a resume from REMAINING)
plusargs = ["+CASE=dma9"]

[[test]]
name     = "probe_dma10"
# fixed 2026-11-01 (DMA-12: failed by a_no_read_before_refusal)
plusargs = ["+CASE=dma10"]

[[test]]
name     = "probe_r9_sar"
plusargs = ["+CASE=r9_sar"]

[[test]]
name     = "probe_dma11a"
# fixed 2026-11-01 (DMA-9: failed by a_remaining_complete_consistent)
plusargs = ["+CASE=dma11a"]

[[test]]
name     = "probe_dma11b"
# fixed 2026-11-01 (DMA-9: failed by a_beat_belongs_to_arm)
plusargs = ["+CASE=dma11b"]

[[test]]
name     = "probe_unaligned"
plusargs = ["+CASE=unaligned"]
# fixed 2026-11-01 (DMA-10: failed by a_haddr_aligned)

[[test]]
name     = "probe_stop_size"
# fixed 2026-11-01 (DMA-14: failed by a_beat_size_atomic)
plusargs = ["+CASE=stop_size"]

[[test]]
name     = "probe_m2m_ack"
plusargs = ["+CASE=m2m_ack"]
# fixed 2026-11-01 (DMA-15: failed with [FAIL] [DMA-15])

[[test]]
name     = "probe_ack"
plusargs = ["+CASE=ack"]
