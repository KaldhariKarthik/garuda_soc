# DMA defect reproducers (Track A, DMA plan D1): tb/dma/tb_dma_probe.sv, one row per
# case. Each case checks the specified behaviour, so it fails on today's RTL exactly
# while its defect is open (xfail with the bug ID and the reason it must fail for)
# and passes once fixed. dma_sva is bound, so the DMA-10/DMA-11 rows also show the
# detector firing: these rows are the negative control of those properties.
# Run: make -f flow/mk/track_a.mk dma_probe
[suite]
block = "dma"
name  = "probe"
kind  = "sim"
xfail = "tb/dma/run/xfail.tsv"

[defaults]
flist   = "tb/dma/filelist_dma_probe.f"
top     = "tb_dma_probe"
marker  = '^RESULT: PASSED'
timeout = 600

[[test]]
name     = "probe_dma9"
fail_reason = '^\[FAIL\] \[DMA-9\] \[F20\] EN set again continues'
plusargs = ["+CASE=dma9"]

[[test]]
name     = "probe_dma10"
fail_reason = 'Assertion failed in \S*a_no_read_before_refusal'
plusargs = ["+CASE=dma10"]

[[test]]
name     = "probe_r9_sar"
plusargs = ["+CASE=r9_sar"]

[[test]]
name     = "probe_dma11a"
fail_reason = 'Assertion failed in \S*a_remaining_complete_consistent'
plusargs = ["+CASE=dma11a"]

[[test]]
name     = "probe_dma11b"
fail_reason = 'Assertion failed in \S*a_beat_belongs_to_arm'
plusargs = ["+CASE=dma11b"]

[[test]]
name     = "probe_unaligned"
plusargs = ["+CASE=unaligned"]
fail_reason = 'Assertion failed in \S*a_haddr_aligned'

[[test]]
name     = "probe_stop_size"
fail_reason = 'Assertion failed in \S*a_beat_size_atomic'
plusargs = ["+CASE=stop_size"]

[[test]]
name     = "probe_m2m_ack"
plusargs = ["+CASE=m2m_ack"]
fail_reason = '^\[FAIL\] \[DMA-15\]'

[[test]]
name     = "probe_ack"
plusargs = ["+CASE=ack"]
