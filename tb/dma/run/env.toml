# DMA environment (Track A, DMA plan D4/D5): tb/dma/env/dma_env_top.sv, plain SV
# shaped like UVM, reference model + scoreboard written from the spec, AHB-Lite
# slave with waits / stalls / ERROR, D-21 request agents, dma_sva bound.
# Run: make -f flow/mk/track_a.mk dma_env
[suite]
block = "dma"
name  = "env"
kind  = "sim"
xfail = "tb/dma/run/xfail.tsv"

[defaults]
flist   = "tb/dma/env/filelist_dma_env.f"
top     = "tb_dma_env"
marker  = '^RESULT: PASSED'
timeout = 1800

[[test]]
name     = "env_smoke"
plusargs = ["+TEST=smoke"]

[[test]]
name     = "env_qual"
plusargs = ["+TEST=qual"]

[[test]]
name     = "env_coll"
plusargs = ["+TEST=coll"]

[[test]]
name     = "env_reset"
plusargs = ["+TEST=reset"]

[[test]]
name     = "env_arb"
plusargs = ["+TEST=arb"]

[[test]]
name     = "env_req"
plusargs = ["+TEST=req"]

[[test]]
name     = "env_matrix"
plusargs = ["+TEST=matrix"]

[[test]]
name     = "env_edge"
plusargs = ["+TEST=edge"]

[[test]]
name     = "env_bits"
plusargs = ["+TEST=bits"]

# R-9 in every mode and side; DMA-10 (open): the source is read before a destination
# refusal, once per destination case (three)
[[test]]
name     = "env_r9"
plusargs = ["+TEST=r9"]
known    = [['a_no_read_before_refusal', 3, 'DMA-10']]

# F50 negative control: a held request breaks D-21; dma_req_checker must report it
[[test]]
name     = "negctl_held_request"
plusargs = ["+TEST=held"]
fail_reason = 'request still high .* cycles after ack'

[[test]]
name     = "env_rand"
plusargs = ["+TEST=rand", "+ITER=40"]

# negative control: the scoreboard must report a wdata fault
[[test]]
name     = "negctl_sb_wdata"
plusargs = ["+TEST=smoke", "+INJECT=wdata"]
fail_reason = '\[FAIL\] \[SB\] .*wrote [0-9a-f]+, the read carried'

# negative control: the scoreboard must report a drop fault
[[test]]
name     = "negctl_sb_drop"
plusargs = ["+TEST=smoke", "+INJECT=drop"]
fail_reason = '\[FAIL\] \[SB\] .*(a second read before the write|read but never written|REMAINING)'

# negative control: the scoreboard must report a stat fault
[[test]]
name     = "negctl_sb_stat"
plusargs = ["+TEST=smoke", "+INJECT=stat"]
fail_reason = '\[FAIL\] \[SB\] .*REMAINING'

# negative control: the scoreboard must report a irq fault
[[test]]
name     = "negctl_sb_irq"
plusargs = ["+TEST=smoke", "+INJECT=irq"]
fail_reason = '\[FAIL\] \[SB\] .*dma_complete'

# negative control: the scoreboard must report a ack fault
[[test]]
name     = "negctl_sb_ack"
plusargs = ["+TEST=smoke", "+INJECT=ack"]
fail_reason = '\[FAIL\] \[SB\] .*acks for'

# negative control of the pin-level beat checker (R4): a byte beat takes its byte
# from lane 0 always; the checker must report it from the pins
[[test]]
name     = "negctl_beatchk_lane0"
plusargs = ["+TEST=smoke"]
replace  = { "rtl/dma/dma_engine.v" = "tb/dma/mut/dma_engine_mut_lane0.v" }
fail_reason = '\[FAIL\] \[BEATCHK\] .*wrote'

# bus plan B3 (Fresh plan Phase 3 gaps)
[[test]]
name     = "env_maxcnt"
plusargs = ["+TEST=maxcnt"]

# bus plan B3 (Fresh plan Phase 3 gaps)
[[test]]
name     = "env_dma16"
plusargs = ["+TEST=dma16"]

# bus plan B3 (Fresh plan Phase 3 gaps)
[[test]]
name     = "env_held_err"
plusargs = ["+TEST=held_err"]
