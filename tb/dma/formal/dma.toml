# DMA-14 address latch reverted: the read goes to the channel's live SAR (review 2026-11-03)
[[task]]
name    = "mut_dma14_addr_revert"
expect_fail = ["a_read_addr"]   # the reverted fix must break this (2026-11-03)
mode    = "bmc"
depth   = 24
engine  = "smtbmc yices"
replace = { "rtl/dma/dma_engine.v" = "tb/dma/formal/mutants/dma_engine_mut_dma14_addr_revert.v" }
script  = ["chformal -assert -remove t:$check n:u_dma_props_a.*a_read_addr* %d"]
timeout = 3600
