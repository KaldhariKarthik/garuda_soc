expect_fail = ["a_sar_step", "a_dar_step"]   # the reverted fix must break this (2026-11-03)
mode    = "bmc"
depth   = 24
engine  = "smtbmc yices"
replace = { "rtl/dma/dma_chan.v" = "tb/dma/formal/mutants/dma_chan_mut_dma14_step_revert.v" }
script  = ["chformal -assert -remove t:$check n:u_dma_props_a.*a_sar_step* n:u_dma_props_a.*a_dar_step* %u %d"]
timeout = 3600
min_asserts = 12
