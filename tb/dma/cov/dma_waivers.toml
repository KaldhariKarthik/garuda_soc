# DMA coverage waivers (H5; Track A, DMA plan D7). Read by tools/cov/cov_report.py.
#
# Each [[waiver]] removes matching points from the target, with:
#   id, metric (line|branch|expr|toggle|fsm|covergroup), file (glob),
#   match (regex on the point label: "line:<n> <expr>" / "<signal>[bit]:0->1" /
#   "<covergroup>.<coverpoint>.<bin>"), category, reason, evidence, reviewer.
# Categories (H5): constant, unreachable, not-connected, ignore, tool.
# The report FAILS on a stale waiver (matches nothing) and on a waiver that
# matches a COVERED point (except `ignore`), so a wrong claim cannot survive.
# A reachable hole is never waived: it gets a test.
# Formal evidence: tb/dma/formal/cov_unreach.toml (make -f flow/mk/track_a_run.mk
# fv_dma_cov), properties in tb/dma/formal/dma_cov_sva.sv and dma_sva's
# a_state_legal, PROVEN (abc pdr, unbounded) on 2026-10-12; negative control
# mut_cov_prio_inv FAILS as planted.
# `tool` waivers are Verilator only and are never exported to
# flow/cov/dma_exclusions.tcl (IMC measures those points itself).
# The toggle section at the end is generated: tools/cov/gen_toggle_waivers.py dma


# =============================================================================
# FUNCTIONAL: cg_dma_arb contests the shipped priority map rules out
