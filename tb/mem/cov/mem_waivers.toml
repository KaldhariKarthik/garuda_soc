# =============================================================================
# LINT SINKS and inputs the memories do not use (HBURST, HPROT)
# =============================================================================
[[waiver]]
id = "CM-LINT-1"
metric = "expr"
file = "rtl/*/*_top.v"
match = "^line:(77|78|97) "
category = "ignore"
reason = "`wire _unused = |{hburst_i, hprot_i}` only tells lint the inputs are unused on purpose; it drives nothing and is removed in synthesis. The memories ignore HBURST and HPROT (GARUDA-MEM-SPEC-001 section 5)."
evidence = "rtl/isram/isram_top.v:78, rtl/dsram/dsram_top.v:97, rtl/brom/bootrom_top.v:77"
reviewer = "pending: Sreyesh"

[[waiver]]
id = "CM-LINT-2"
metric = "toggle"
file = "rtl/*/*_top.v"
match = "^(hburst_i\\[[12]\\]|hprot_i\\[[0-3]\\]):"
category = "ignore"
reason = "HBURST[2:1] and HPROT reach only the lint sink (CM-LINT-1): no logic reads them. GARUDA masters issue SINGLE / INCR only (HBURST[0], which is toggled), and the bench master has one fixed HPROT."
evidence = "rtl/isram/isram_top.v:78, rtl/dsram/dsram_top.v:97, rtl/brom/bootrom_top.v:77; AHB environment FA-2 (tb/ahb/formal/ahb_fv_env.sv)"
reviewer = "pending: Sreyesh"

