# AHB interconnect environment (Track A bus plan B1, A4/A5): tb/ahb/env/tb_ahb_env.sv,
# plain SV shaped like UVM; four master agents shaped like the GARUDA masters, four
# slave responders, AHB-Lite checkers on all five ports, a conservation scoreboard
# written from the spec, ahb_interconnect_sva and ahb_cov bound.
# Run: make -f flow/mk/track_a.mk ahb_env
[suite]
block = "ahb"
name  = "env"
kind  = "sim"
xfail = "tb/ahb/run/xfail.tsv"

[defaults]
flist   = "tb/ahb/env/filelist_ahb_env.f"
top     = "tb_ahb_env"
marker  = '^RESULT: PASSED'
timeout = 1800

[[test]]
name     = "env_smoke"
plusargs = ["+TEST=smoke"]

[[test]]
name     = "env_sets"
plusargs = ["+TEST=sets"]

[[test]]
name     = "env_preempt"
plusargs = ["+TEST=preempt"]

[[test]]
name     = "env_decode"
plusargs = ["+TEST=decode"]

[[test]]
name     = "env_errnext"
plusargs = ["+TEST=errnext"]

[[test]]
name     = "env_waits"
plusargs = ["+TEST=waits"]

[[test]]
name     = "env_reset"
plusargs = ["+TEST=reset"]

[[test]]
name     = "env_starve"
plusargs = ["+TEST=starve"]

[[test]]
name     = "env_dma"
plusargs = ["+TEST=dma"]

[[test]]
name     = "env_sba"
plusargs = ["+TEST=sba"]

[[test]]
name     = "env_random"
plusargs = ["+TEST=random"]

[[test]]
name     = "env_toggle"
plusargs = ["+TEST=toggle"]

[[test]]
name     = "env_capture"
plusargs = ["+TEST=capture"]

# every directed test in one run: the good-RTL baseline of the planted-defect run
[[test]]
name     = "env_mut_baseline"
plusargs = ["+TEST=mut"]

# AHB-7 reproducer in simulation: an I-port-shaped M0 that never cancels; the detectors fire
[[test]]
name        = "env_ahb7"
plusargs    = ["+TEST=ahb7"]
fail_reason = 'Assertion failed in \S*a_held_resp_okay'

[[test]]
name        = "negctl_sb_drop"
plusargs    = ["+TEST=random", "+INJECT=drop"]
fail_reason = '^\[FAIL\] \[SB\]'

[[test]]
name        = "negctl_sb_wdata"
plusargs    = ["+TEST=random", "+INJECT=wdata"]
fail_reason = '^\[FAIL\] \[SB\]'

[[test]]
name        = "negctl_sb_rdata"
plusargs    = ["+TEST=random", "+INJECT=rdata"]
fail_reason = '^\[FAIL\] \[SB\]'

[[test]]
name        = "negctl_sb_dup"
plusargs    = ["+TEST=random", "+INJECT=dup"]
fail_reason = '^\[FAIL\] \[SB\]'
