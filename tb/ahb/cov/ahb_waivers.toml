category = "constant"
reason   = "A SINGLE-only master drives HTRANS IDLE (00) or NONSEQ (10), never SEQ/BUSY: bit 0 is 0 on the D-port, SBA and DMA ports (htrans_bus bits 2, 4, 6 are those bits; bit 0 of the I-port toggles with its SEQ beats)."
evidence = "literal rtl/core/dport_master.sv:101,106; rtl/debug/sba_master.sv:58,62; rtl/dma/dma_engine.sv:122,129,146,154"
reviewer = "pending: Karthik"

