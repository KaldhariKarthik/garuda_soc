# OpenOCD against the GARUDA debug block in simulation (Track A plan 6A.5 G7).
# The bench tb_debug_ocd.sv serves remote_bitbang on 127.0.0.1:9823.
adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port 9823
transport select jtag
adapter speed 1000
jtag newtap garuda cpu -irlen 5 -expected-id 0x00000db1
target create garuda.cpu riscv -chain-position garuda.cpu
riscv set_mem_access sysbus
gdb_port disabled
telnet_port disabled
tcl_port disabled
