# Debug seeded random DMI/SBA traffic against the model (plan 6A.5 G3), 20 seeds.
# GENERATED (seeds 7700..7719) -- regenerate rather than edit. 500 accumulate nightly.
# Run: python3.12 tools/run/garuda_run.py suite tb/debug/run/debug_seeds.toml
[suite]
block = "debug"
name  = "seeds"
kind  = "sim"
xfail = "tb/debug/run/xfail.tsv"

[defaults]
flist   = "tb/debug/filelist_debug.f"
top     = "tb_debug"
marker  = '^RESULT: PASSED'
timeout = 2400
require = ['tb_debug: checks=94 +FAIL=0', '^random: [0-9]+ ops checked, 0 mismatches']

[[test]]
name     = "rand_s7700"
plusargs = ["+RAND=300", "+SEED=7700"]

