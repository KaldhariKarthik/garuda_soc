<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 765" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#444"/></marker>
<style>.tt{font-size:12.5px;font-family:Consolas,monospace;fill:#1f1f1f}.sm{font-size:11.5px;fill:#444}.bt{font-size:14px;font-weight:bold;fill:#1f1f1f}.title{font-size:17px;font-weight:bold;fill:#1f1f1f}</style></defs>
<text x="600" y="30" text-anchor="middle" class="title">Block 22 — Clock Divider: Structure and Waveforms</text>

<rect x="30" y="80" width="140" height="56" rx="6" fill="#e4d5f5" stroke="#8a5cc0" stroke-width="2"/>
<text x="100" y="103" text-anchor="middle" class="tt">clk_ref_i</text>
<text x="100" y="122" text-anchor="middle" class="sm">200 MHz</text>

<rect x="30" y="180" width="140" height="56" rx="6" fill="#e4d5f5" stroke="#8a5cc0" stroke-width="2"/>
<text x="100" y="203" text-anchor="middle" class="tt">por_n_i</text>
<text x="100" y="222" text-anchor="middle" class="sm">async assert</text>

<!-- div2 flop -->
<rect x="250" y="76" width="180" height="90" rx="8" fill="#bfe3dd" stroke="#2f8f80" stroke-width="2"/>
<text x="340" y="102" text-anchor="middle" class="bt">÷2 toggle flop</text>
<text x="340" y="124" text-anchor="middle" class="sm">one FF, inverting feedback</text>
<text x="340" y="144" text-anchor="middle" class="sm">exact 50% duty, no PLL</text>
<text x="340" y="160" text-anchor="middle" class="sm">reset from local sync</text>

<!-- fallback mux -->
<rect x="520" y="76" width="180" height="90" rx="8" fill="#f7d9d2" stroke="#cf5b43" stroke-width="2"/>
<text x="610" y="100" text-anchor="middle" class="bt">Mode mux (hclk only)</text>
<text x="610" y="121" text-anchor="middle" class="sm">0: ÷1 ref (200 MHz)</text>
<text x="610" y="139" text-anchor="middle" class="sm">1: ÷2 net (100 MHz)</text>
<text x="610" y="158" text-anchor="middle" class="sm">select frozen at reset</text>

<rect x="520" y="200" width="180" height="56" rx="6" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
<text x="610" y="220" text-anchor="middle" class="tt">fallback_sel_i</text>
<text x="610" y="240" text-anchor="middle" class="sm">static strap / eFuse</text>

<rect x="790" y="60" width="180" height="56" rx="6" fill="#bfe3dd" stroke="#2f8f80" stroke-width="2"/>
<text x="880" y="82" text-anchor="middle" class="tt">hclk_o</text>
<text x="880" y="101" text-anchor="middle" class="sm">200 normal / 100 fallback</text>

<rect x="790" y="140" width="180" height="56" rx="6" fill="#bfe3dd" stroke="#2f8f80" stroke-width="2"/>
<text x="880" y="162" text-anchor="middle" class="tt">pclk_o</text>
<text x="880" y="181" text-anchor="middle" class="sm">100 MHz in BOTH modes</text>

<line x1="170" y1="108" x2="246" y2="112" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<rect x="196" y="300" width="210" height="74" rx="8" fill="#f7d9d2" stroke="#cf5b43" stroke-width="2"/>
<text x="301" y="324" text-anchor="middle" class="bt">Reset-release sync</text>
<text x="301" y="344" text-anchor="middle" class="sm">2 FF, clocked by clk_ref_i</text>
<text x="301" y="363" text-anchor="middle" class="sm">async assert, sync release</text>
<line x1="170" y1="218" x2="196" y2="312" stroke="#cf5b43" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M301 300 L301 172" fill="none" stroke="#cf5b43" stroke-width="1.8" marker-end="url(#a)"/>
<text x="424" y="330" class="sm" fill="#cf5b43">releases the ÷2 flop on a clean clk_ref edge —</text>
<text x="424" y="350" class="sm" fill="#cf5b43">no runt first pclk pulse (§4.5); also captures the strap (§4.4.2)</text>
<line x1="150" y1="136" x2="150" y2="337" stroke="#8a5cc0" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="150" y1="337" x2="192" y2="337" stroke="#8a5cc0" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="430" y1="112" x2="516" y2="112" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<line x1="610" y1="198" x2="610" y2="170" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<line x1="700" y1="100" x2="786" y2="88" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<path d="M410 150 Q470 190 470 168 L470 168" fill="none" stroke="none"/>
<path d="M440 166 L440 424 L762 424 L762 176 L786 172" fill="none" stroke="#2f8f80" stroke-width="2" marker-end="url(#a)"/>
<text x="601" y="444" text-anchor="middle" class="sm">the ÷2 output is pclk directly. Normal: pclk = hclk÷2. Fallback: the mux also selects this net for hclk, so hclk = pclk (÷1).</text>

<!-- waveforms -->
<g stroke="#e8e8e8" stroke-width="1">
<line x1="240" y1="470" x2="240" y2="630"/><line x1="300" y1="470" x2="300" y2="630"/>
<line x1="360" y1="470" x2="360" y2="630"/><line x1="420" y1="470" x2="420" y2="630"/>
<line x1="480" y1="470" x2="480" y2="630"/><line x1="540" y1="470" x2="540" y2="630"/>
<line x1="600" y1="470" x2="600" y2="630"/><line x1="660" y1="470" x2="660" y2="630"/>
<line x1="720" y1="470" x2="720" y2="630"/><line x1="780" y1="470" x2="780" y2="630"/>
<line x1="840" y1="470" x2="840" y2="630"/><line x1="900" y1="470" x2="900" y2="630"/>
<line x1="960" y1="470" x2="960" y2="630"/></g>

<text x="100" y="500" class="tt">clk_ref / hclk</text>
<path d="M240,502 h30 v-22 h30 v22 h30 v-22 h30 v22 h30 v-22 h30 v22 h30 v-22 h30 v22 h30 v-22 h30 v22 h30 v-22 h30 v22 h30 v-22 h30 v22 h30 v-22 h30 v22 h30 v-22 h30 v22 h30 v-22 h30 v22 h30 v-22 h30 v22 h30 v-22 h30 v22"
 fill="none" stroke="#8a5cc0" stroke-width="1.8"/>

<text x="100" y="570" class="tt">pclk (÷2)</text>
<path d="M240,572 h60 v-22 h60 v22 h60 v-22 h60 v22 h60 v-22 h60 v22 h60 v-22 h60 v22 h60 v-22 h60 v22 h60 v-22 h60 v22 h60 v-22"
 fill="none" stroke="#2f8f80" stroke-width="1.8"/>

<line x1="240" y1="458" x2="240" y2="640" stroke="#b58900" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="248" y="654" class="sm" fill="#b58900">both edges aligned here — every pclk rising edge coincides with an hclk rising edge</text>

<text x="600" y="694" text-anchor="middle" class="sm">Waveforms show NORMAL mode. The Bridge and CLIC depend on the two clocks being synchronous and edge-aligned with an integer ratio —</text>
<text x="600" y="714" text-anchor="middle" class="sm">÷2 in normal, ÷1 in fallback. Neither mode is an asynchronous relationship, which is why no synchronisers are needed in either.</text>
<text x="600" y="742" text-anchor="middle" class="sm" font-style="italic" fill="#808080">Teal = clock generation · Coral = mode control · Purple = external input / reference waveform. Editable source: GARUDA_CRG_ClockDivider.svg</text>
</svg>
