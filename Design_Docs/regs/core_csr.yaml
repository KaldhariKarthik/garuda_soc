# =============================================================================
# GARUDA core CSR contract (DN-CSR, Track A plan W2), one entry per address.
# Single source for: tools/csr_map.py (which addresses must exist / must trap,
# and every difference from Spike with its reason), the co-simulation CSR
# table (E3), riscv-formal [csrs] (E4), riscv-dv implemented_csr (E6), the
# cg_csr coverage bins (E8) and the CORE spec 6.1 table.
#
# kind:   implemented  storage or a defined read value; never traps on read
#         read-zero    exists (privileged 1.12) but reads 0; writes ignored
#                      unless access is RO, in which case a write traps
#         absent       not implemented: every access traps (illegal instruction)
# access: RW, WARL, RO (RO also by address: 0xC00-0xFFF are read-only)
# spike:  same | garuda-only | spike-only -- whether Spike agrees the address
#         exists; anything but `same` carries the reason it differs.
# Addresses not listed are absent on both and trap.
# =============================================================================
csrs:
  - {addr: 0x300, name: mstatus, kind: implemented, access: WARL, reset: "0x00001800", spike: same, desc: "MIE(3), MPIE(7) storage; MPP reads 11 (M only); all else 0"}
  - {addr: 0x301, name: misa, kind: implemented, access: WARL, reset: "0x40001100", spike: same, desc: "RV32 I+M; writes ignored (ERRATUM T-2). DN-ISA ruling pending: M vs Zmmul"}
