<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Arial, sans-serif">
<style>.title{font-size:16px;font-weight:bold}.sn{font-size:12px;font-family:Consolas,monospace;fill:#222;font-weight:bold}
.note{font-size:11px;fill:#555}.ph{font-size:11px;font-weight:bold;fill:#0F6E56}.val{font-size:10px;font-family:Consolas,monospace;fill:#333}</style>
<text class="title" x="500" y="30" text-anchor="middle">AHB-Lite single beat (read source, then write destination) — one transfer pair</text>

<!-- clock cycles grid -->
<g stroke="#ddd" stroke-width="1">
<line x1="180" y1="60" x2="180" y2="470"/><line x1="280" y1="60" x2="280" y2="470"/>
<line x1="380" y1="60" x2="380" y2="470"/><line x1="480" y1="60" x2="480" y2="470"/>
<line x1="580" y1="60" x2="580" y2="470"/><line x1="680" y1="60" x2="680" y2="470"/>
<line x1="780" y1="60" x2="780" y2="470"/></g>
<g class="val" fill="#999" text-anchor="middle">
<text x="230" y="55">T1</text><text x="330" y="55">T2</text><text x="430" y="55">T3</text>
<text x="530" y="55">T4</text><text x="630" y="55">T5</text><text x="730" y="55">T6</text></g>

<!-- hclk -->
<text class="sn" x="40" y="85">hclk</text>
<polyline points="180,90 180,70 230,70 230,90 280,90 280,70 330,70 330,90 380,90 380,70 430,70 430,90 480,90 480,70 530,70 530,90 580,90 580,70 630,70 630,90 680,90 680,70 730,70 730,90 780,90" fill="none" stroke="#222" stroke-width="1.5"/>

<!-- htrans -->
<text class="sn" x="40" y="135">htrans</text>
<text class="val" x="205" y="140" text-anchor="middle">NONSEQ</text>
<text class="val" x="305" y="140" text-anchor="middle" fill="#993556">NONSEQ</text>
<text class="val" x="450" y="140" text-anchor="middle">IDLE</text>
<line x1="180" y1="150" x2="780" y2="150" stroke="#bbb" stroke-width="0.5"/>

<!-- haddr -->
<text class="sn" x="40" y="185">haddr</text>
<rect x="180" y="170" width="100" height="22" fill="#E1F5EE" stroke="#0F6E56"/>
<text class="val" x="230" y="185" text-anchor="middle">src_addr</text>
<rect x="280" y="170" width="100" height="22" fill="#FBEAF0" stroke="#993556"/>
<text class="val" x="330" y="185" text-anchor="middle">dst_addr</text>

<!-- hwrite -->
<text class="sn" x="40" y="230">hwrite</text>
<text class="val" x="230" y="232" text-anchor="middle" fill="#0F6E56">0 (read)</text>
<text class="val" x="330" y="232" text-anchor="middle" fill="#993556">1 (write)</text>
<line x1="180" y1="242" x2="780" y2="242" stroke="#bbb" stroke-width="0.5"/>

<!-- hrdata -->
<text class="sn" x="40" y="278">hrdata</text>
<rect x="280" y="263" width="100" height="22" fill="#E1F5EE" stroke="#0F6E56"/>
<text class="val" x="330" y="278" text-anchor="middle">data in</text>
<text class="note" x="395" y="278">captured into buffer</text>

<!-- hwdata -->
<text class="sn" x="40" y="320">hwdata</text>
<rect x="380" y="305" width="100" height="22" fill="#FBEAF0" stroke="#993556"/>
<text class="val" x="430" y="320" text-anchor="middle">data out</text>
<text class="note" x="495" y="320">from buffer</text>

<!-- hready -->
<text class="sn" x="40" y="365">hready</text>
<polyline points="180,360 780,360" fill="none" stroke="#222" stroke-width="1.5"/>
<text class="val" x="480" y="378" text-anchor="middle" fill="#888">high = no wait states (1 if slave ready)</text>

<!-- dma_ack -->
<text class="sn" x="40" y="415">dma_ack</text>
<polyline points="180,410 430,410 430,395 480,395 480,410 780,410" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
<text class="note" x="455" y="392" text-anchor="middle">1-cycle pulse</text>

<!-- phase labels -->
<text class="ph" x="230" y="450" text-anchor="middle">READ addr</text>
<text class="ph" x="330" y="450" text-anchor="middle">READ data /</text>
<text class="ph" x="330" y="463" text-anchor="middle">WRITE addr</text>
<text class="ph" x="430" y="450" text-anchor="middle">WRITE data</text>

<text class="note" x="180" y="500">AHB pipelining: the write address phase (T2) overlaps the read data phase (T2). So one beat = ~3 cycles, not 4.</text>
<text class="note" x="180" y="518">If hready=0 in any data phase, the master holds address/data stable and stalls until hready returns high.</text>
<text class="note" x="180" y="536">For APB-mapped sources (peripheral FIFOs), the bridge inserts extra wait states (~3 hclk equivalent) on the read.</text>
</svg>
