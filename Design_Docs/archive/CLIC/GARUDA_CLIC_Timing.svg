<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 560" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .sig{font-size:13px;font-family:Consolas,monospace;fill:#1f1f1f}
      .title{font-size:16px;font-weight:bold;fill:#1f1f1f}
      .note{font-size:11.5px;fill:#555}
      .val{font-size:11px;font-family:Consolas,monospace;fill:#1f1f1f}
    </style>
  </defs>
  <text x="630" y="28" text-anchor="middle" class="title">GARUDA CLIC — Take, Acknowledge, and Preemptive Nesting (higher level interrupts an active handler)</text>

  <!-- guides: area 220..1220, 20 cells of 50 -->
  <g stroke="#e8e8e8" stroke-width="1">
    <line x1="220" y1="55" x2="220" y2="470"/><line x1="270" y1="55" x2="270" y2="470"/>
    <line x1="320" y1="55" x2="320" y2="470"/><line x1="370" y1="55" x2="370" y2="470"/>
    <line x1="420" y1="55" x2="420" y2="470"/><line x1="470" y1="55" x2="470" y2="470"/>
    <line x1="520" y1="55" x2="520" y2="470"/><line x1="570" y1="55" x2="570" y2="470"/>
    <line x1="620" y1="55" x2="620" y2="470"/><line x1="670" y1="55" x2="670" y2="470"/>
    <line x1="720" y1="55" x2="720" y2="470"/><line x1="770" y1="55" x2="770" y2="470"/>
    <line x1="820" y1="55" x2="820" y2="470"/><line x1="870" y1="55" x2="870" y2="470"/>
    <line x1="920" y1="55" x2="920" y2="470"/><line x1="970" y1="55" x2="970" y2="470"/>
    <line x1="1020" y1="55" x2="1020" y2="470"/><line x1="1070" y1="55" x2="1070" y2="470"/>
    <line x1="1120" y1="55" x2="1120" y2="470"/><line x1="1170" y1="55" x2="1170" y2="470"/>
    <line x1="1220" y1="55" x2="1220" y2="470"/>
  </g>

  <!-- clk -->
  <text x="12" y="78" class="sig">clk (200MHz)</text>
  <path d="M220,80 h25 v-20 h25 v20 h25 v-20 h25 v20 h25 v-20 h25 v20 h25 v-20 h25 v20 h25 v-20 h25 v20 h25 v-20 h25 v20 h25 v-20 h25 v20 h25 v-20 h25 v20 h25 v-20 h25 v20 h25 v-20 h25 v20 h25 v-20 h25 v20 h25 v-20 h25 v20 h25 v-20 h25 v20 h25 v-20 h25 v20 h25 v-20 h25 v20"
        fill="none" stroke="#8a5cc0" stroke-width="1.6"/>

  <!-- Source A (level 3) pending -->
  <text x="12" y="128" class="sig">srcA (lvl 3)</text>
  <path d="M220,128 h50 v-20 h500 v20 h450" fill="none" stroke="#c14e86" stroke-width="1.7"/>

  <!-- Source B (level 6) pending -->
  <text x="12" y="172" class="sig">srcB (lvl 6)</text>
  <path d="M220,172 h300 v-20 h300 v20 h400" fill="none" stroke="#c14e86" stroke-width="1.7"/>

  <!-- clic_irq_o -->
  <text x="12" y="216" class="sig">clic_irq_o</text>
  <path d="M220,216 h50 v-20 h900 v20 h50" fill="none" stroke="#2f8f80" stroke-width="1.7"/>

  <!-- clic_irq_lvl_o -->
  <text x="12" y="262" class="sig">clic_irq_lvl_o</text>
  <line x1="220" y1="262" x2="270" y2="262" stroke="#8a5cc0" stroke-width="1.5"/>
  <path d="M270,262 l8,-11 h230 l8,11 l-8,11 h-230 z" fill="none" stroke="#8a5cc0" stroke-width="1.4"/>
  <text x="393" y="256" text-anchor="middle" class="val">3</text>
  <path d="M516,262 l8,-11 h480 l8,11 l-8,11 h-480 z" fill="none" stroke="#8a5cc0" stroke-width="1.4"/>
  <text x="762" y="256" text-anchor="middle" class="val">6 (higher: preempts)</text>
  <line x1="1012" y1="262" x2="1220" y2="262" stroke="#8a5cc0" stroke-width="1.5"/>

  <!-- clic_irq_ack_i -->
  <text x="12" y="306" class="sig">clic_irq_ack_i</text>
  <path d="M220,306 h100 v-20 h25 v20 h180 v-20 h25 v20 h620" fill="none" stroke="#cf5b43" stroke-width="1.7"/>
  <text x="332" y="326" text-anchor="middle" class="note">take A</text>
  <text x="537" y="326" text-anchor="middle" class="note">take B</text>

  <!-- handler level (mintstatus) -->
  <text x="12" y="360" class="sig">handler level</text>
  <line x1="220" y1="360" x2="345" y2="360" stroke="#8a5cc0" stroke-width="1.5"/>
  <path d="M345,360 l8,-11 h160 l8,11 l-8,11 h-160 z" fill="none" stroke="#8a5cc0" stroke-width="1.4"/>
  <text x="433" y="354" text-anchor="middle" class="val">3 (A running)</text>
  <path d="M521,360 l8,-11 h480 l8,11 l-8,11 h-480 z" fill="none" stroke="#8a5cc0" stroke-width="1.4"/>
  <text x="765" y="354" text-anchor="middle" class="val">6 (B running, A suspended)</text>
  <line x1="1017" y1="360" x2="1220" y2="360" stroke="#8a5cc0" stroke-width="1.5"/>

  <!-- DMA SR W1C / source clear -->
  <text x="12" y="404" class="sig">srcB clear (W1C)</text>
  <path d="M220,404 h750 v-20 h25 v20 h225" fill="none" stroke="#cf5b43" stroke-width="1.6"/>
  <text x="983" y="424" text-anchor="middle" class="note">ISR B clears source; srcB line drops → B returns → A resumes at lvl 3</text>

  <!-- annotations -->
  <text x="332" y="452" text-anchor="middle" class="note">A: lvl 3 &gt; thresh 0 → taken</text>
  <text x="640" y="452" text-anchor="middle" class="note">B: lvl 6 &gt; active 3 → preempts A</text>
  <text x="1090" y="452" text-anchor="middle" class="note">mret from A</text>

  <text x="630" y="500" text-anchor="middle" class="note" font-style="italic" fill="#808080">srcA stays pending through B's handler (level-sensitive, not yet cleared); it resumes only after B returns and A's own source is serviced.</text>
  <text x="630" y="520" text-anchor="middle" class="note" font-style="italic" fill="#808080">Pink = source lines · Teal = irq request · Coral = core ack / source-clear · Purple = level/id values. Editable source: GARUDA_CLIC_Timing.svg</text>
</svg>
