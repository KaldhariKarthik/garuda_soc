<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#444"/>
    </marker>
    <style>
      .t{font-size:13px;fill:#1f1f1f}
      .tt{font-size:12.5px;font-family:Consolas,monospace;fill:#1f1f1f}
      .sm{font-size:11.5px;fill:#444}
      .bt{font-size:14.5px;font-weight:bold;fill:#1f1f1f}
      .title{font-size:17px;font-weight:bold;fill:#1f1f1f}
    </style>
  </defs>
  <text x="610" y="32" text-anchor="middle" class="title">GARUDA Memory Subsystem (Blocks 3/4/5) — Three AHB-Lite Slaves</text>

  <!-- interconnect -->
  <rect x="330" y="70" width="560" height="74" rx="8" fill="#f7d9d2" stroke="#cf5b43" stroke-width="2"/>
  <text x="610" y="98" text-anchor="middle" class="bt">AHB-Lite Interconnect (Block 6) — 200 MHz</text>
  <text x="610" y="120" text-anchor="middle" class="sm">HADDR[31:28] decode → per-slave HSEL; shared address/control/wdata; read-data &amp; HREADY mux</text>
  <text x="610" y="136" text-anchor="middle" class="sm">Masters: I-Port, D-Port (core) and DMA</text>

  <!-- S0 ISRAM -->
  <rect x="40" y="230" width="280" height="210" rx="8" fill="#e4d5f5" stroke="#8a5cc0" stroke-width="2"/>
  <text x="180" y="258" text-anchor="middle" class="bt">S0 — Instruction SRAM</text>
  <text x="180" y="278" text-anchor="middle" class="tt">0x0000_0000 · 64 KB</text>
  <rect x="62" y="292" width="236" height="60" rx="6" fill="#bfe3dd" stroke="#2f8f80"/>
  <text x="180" y="313" text-anchor="middle" class="sm">16,384 rows × 32 cols, 6T cells</text>
  <text x="180" y="331" text-anchor="middle" class="sm">14-bit row decode · 32 sense amps</text>
  <text x="180" y="347" text-anchor="middle" class="sm">single-port</text>
  <text x="180" y="374" text-anchor="middle" class="sm">Read-mostly: written only at boot</text>
  <text x="180" y="392" text-anchor="middle" class="sm">by the bootloader (ROM code)</text>
  <text x="180" y="416" text-anchor="middle" class="tt">1-cycle read, 0 wait-states</text>

  <!-- S1 ROM -->
  <rect x="350" y="230" width="230" height="210" rx="8" fill="#e4d5f5" stroke="#8a5cc0" stroke-width="2"/>
  <text x="465" y="258" text-anchor="middle" class="bt">S1 — Boot ROM</text>
  <text x="465" y="278" text-anchor="middle" class="tt">0x1000_0000 · 4 KB</text>
  <rect x="372" y="292" width="186" height="60" rx="6" fill="#bfe3dd" stroke="#2f8f80"/>
  <text x="465" y="313" text-anchor="middle" class="sm">Mask ROM, fixed at tapeout</text>
  <text x="465" y="331" text-anchor="middle" class="sm">1024 × 32 · metal-programmed</text>
  <text x="465" y="347" text-anchor="middle" class="sm">read-only</text>
  <text x="465" y="374" text-anchor="middle" class="sm">Holds the bootloader;</text>
  <text x="465" y="392" text-anchor="middle" class="sm">contains the reset vector</text>
  <text x="465" y="416" text-anchor="middle" class="tt">1-cycle read, 0 wait-states</text>

  <!-- S2 DSRAM -->
  <rect x="610" y="230" width="560" height="210" rx="8" fill="#e4d5f5" stroke="#8a5cc0" stroke-width="2"/>
  <text x="890" y="258" text-anchor="middle" class="bt">S2 — Data SRAM (4 banks)</text>
  <text x="890" y="278" text-anchor="middle" class="tt">0x2000_0000 · 64 KB · HADDR[15:14] selects bank</text>
  <g>
    <rect x="632" y="294" width="118" height="62" rx="6" fill="#bfe3dd" stroke="#2f8f80"/>
    <text x="691" y="314" text-anchor="middle" class="sm">Bank 0 · 16 KB</text>
    <text x="691" y="332" text-anchor="middle" class="sm">Sensor DMA</text>
    <text x="691" y="349" text-anchor="middle" class="tt">[15:14]=00</text>

    <rect x="764" y="294" width="118" height="62" rx="6" fill="#bfe3dd" stroke="#2f8f80"/>
    <text x="823" y="314" text-anchor="middle" class="sm">Bank 1 · 16 KB</text>
    <text x="823" y="332" text-anchor="middle" class="sm">EKF matrices</text>
    <text x="823" y="349" text-anchor="middle" class="tt">[15:14]=01</text>

    <rect x="896" y="294" width="118" height="62" rx="6" fill="#bfe3dd" stroke="#2f8f80"/>
    <text x="955" y="314" text-anchor="middle" class="sm">Bank 2 · 16 KB</text>
    <text x="955" y="332" text-anchor="middle" class="sm">APF + comms</text>
    <text x="955" y="349" text-anchor="middle" class="tt">[15:14]=10</text>

    <rect x="1028" y="294" width="118" height="62" rx="6" fill="#bfe3dd" stroke="#2f8f80"/>
    <text x="1087" y="314" text-anchor="middle" class="sm">Bank 3 · 16 KB</text>
    <text x="1087" y="332" text-anchor="middle" class="sm">FreeRTOS</text>
    <text x="1087" y="349" text-anchor="middle" class="tt">[15:14]=11</text>
  </g>
  <rect x="632" y="372" width="514" height="52" rx="6" fill="#f7d9d2" stroke="#cf5b43"/>
  <text x="889" y="392" text-anchor="middle" class="bt" font-size="13">Bank Arbiter</text>
  <text x="889" y="412" text-anchor="middle" class="sm">Same bank: DMA wins, CPU stalls 1 cycle · Different banks: both proceed in parallel</text>

  <!-- connections -->
  <line x1="420" y1="144" x2="200" y2="228" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="272" y="180" text-anchor="middle" class="tt">hsel_s0</text>
  <line x1="530" y1="144" x2="470" y2="228" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="530" y="188" text-anchor="middle" class="tt">hsel_s1</text>
  <line x1="750" y1="144" x2="880" y2="228" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="840" y="180" text-anchor="middle" class="tt">hsel_s2</text>

  <!-- return bundle note -->
  <rect x="270" y="486" width="680" height="72" rx="8" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
  <text x="610" y="510" text-anchor="middle" class="bt" font-size="13">Per-slave return bundle (frozen, AHB §5.3)</text>
  <text x="610" y="532" text-anchor="middle" class="tt">hrdata_&lt;s&gt;_i[31:0] · hreadyout_&lt;s&gt;_i · hresp_&lt;s&gt;_i</text>
  <text x="610" y="550" text-anchor="middle" class="sm">All three memories tie hresp to OKAY and hreadyout high: zero wait-states, no error path</text>
  <line x1="610" y1="442" x2="610" y2="484" stroke="#444" stroke-width="2" marker-end="url(#a)"/>

  <text x="610" y="600" text-anchor="middle" class="sm">Reset vector 0x1000_0000 (Boot ROM, S1) — the first live fetch after reset. Bootloader copies firmware into ISRAM, then jumps to 0x0000_0000.</text>
  <text x="610" y="640" text-anchor="middle" class="sm" font-style="italic" fill="#808080">Purple = AHB slave boundary · Teal = memory array · Coral = arbitration/interconnect · Amber = frozen return contract. Editable source: GARUDA_MEM_BlockDiagram.svg</text>
</svg>
