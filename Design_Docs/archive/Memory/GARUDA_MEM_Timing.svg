<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 560" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .sig{font-size:13px;font-family:Consolas,monospace;fill:#1f1f1f}
      .title{font-size:16px;font-weight:bold;fill:#1f1f1f}
      .note{font-size:11.5px;fill:#555}
      .val{font-size:11px;font-family:Consolas,monospace;fill:#1f1f1f}
      .hdr{font-size:12.5px;font-weight:bold;fill:#555}
    </style>
  </defs>
  <text x="630" y="24" text-anchor="middle" class="title">GARUDA Memory — Single Access (left) and CPU/DMA Serialised by the Block 6 Arbiter (right)</text>

  <g stroke="#e8e8e8" stroke-width="1">
    <line x1="230" y1="50" x2="230" y2="440"/><line x1="290" y1="50" x2="290" y2="440"/>
    <line x1="350" y1="50" x2="350" y2="440"/><line x1="410" y1="50" x2="410" y2="440"/>
    <line x1="470" y1="50" x2="470" y2="440"/><line x1="530" y1="50" x2="530" y2="440"/>
    <line x1="590" y1="50" x2="590" y2="440"/><line x1="650" y1="50" x2="650" y2="440"/>
    <line x1="710" y1="50" x2="710" y2="440"/><line x1="770" y1="50" x2="770" y2="440"/>
    <line x1="830" y1="50" x2="830" y2="440"/><line x1="890" y1="50" x2="890" y2="440"/>
    <line x1="950" y1="50" x2="950" y2="440"/><line x1="1010" y1="50" x2="1010" y2="440"/>
    <line x1="1070" y1="50" x2="1070" y2="440"/><line x1="1130" y1="50" x2="1130" y2="440"/>
    <line x1="1190" y1="50" x2="1190" y2="440"/>
  </g>
  <line x1="700" y1="46" x2="700" y2="452" stroke="#b58900" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="455" y="64" text-anchor="middle" class="hdr">Case A — single granted access (ISRAM)</text>
  <text x="950" y="64" text-anchor="middle" class="hdr">Case B — CPU and DMA both request; Block 6 grants DMA first</text>

  <text x="12" y="98" class="sig">hclk</text>
  <path d="M230,100 h15 v-20 h30 v20 h30 v-20 h30 v20 h30 v-20 h30 v20 h30 v-20 h30 v20 h30 v-20 h30 v20 h30 v-20 h30 v20 h30 v-20 h30 v20 h30 v-20 h30 v20 h30 v-20 h30 v20 h30 v-20 h30 v20 h30 v-20 h30 v20 h30 v-20 h30 v20 h30 v-20 h30 v20 h30 v-20 h30 v20 h30 v-20 h30 v20 h30 v-20 h30 v20 h30 v-20 h30 v20 h15"
        fill="none" stroke="#8a5cc0" stroke-width="1.6"/>

  <text x="12" y="146" class="sig">grant (Blk 6)</text>
  <line x1="230" y1="148" x2="290" y2="148" stroke="#cf5b43" stroke-width="1.5"/>
  <path d="M290,137 l8,-11 h84 l8,11 l-8,11 h-84 z" fill="none" stroke="#cf5b43" stroke-width="1.5"/>
  <text x="340" y="152" text-anchor="middle" class="val">CPU</text>
  <line x1="390" y1="148" x2="700" y2="148" stroke="#cf5b43" stroke-width="1.5"/>
  <path d="M760,137 l8,-11 h84 l8,11 l-8,11 h-84 z" fill="none" stroke="#cf5b43" stroke-width="1.5"/>
  <text x="810" y="152" text-anchor="middle" class="val">DMA</text>
  <path d="M880,137 l8,-11 h84 l8,11 l-8,11 h-84 z" fill="none" stroke="#cf5b43" stroke-width="1.5"/>
  <text x="930" y="152" text-anchor="middle" class="val">CPU</text>
  <line x1="700" y1="148" x2="760" y2="148" stroke="#cf5b43" stroke-width="1.5"/>
  <line x1="980" y1="148" x2="1190" y2="148" stroke="#cf5b43" stroke-width="1.5"/>

  <text x="12" y="194" class="sig">haddr (to S)</text>
  <line x1="230" y1="196" x2="290" y2="196" stroke="#8a5cc0" stroke-width="1.5"/>
  <path d="M290,185 l8,-11 h84 l8,11 l-8,11 h-84 z" fill="none" stroke="#8a5cc0" stroke-width="1.5"/>
  <text x="340" y="200" text-anchor="middle" class="val">0x0000_1000</text>
  <line x1="390" y1="196" x2="760" y2="196" stroke="#8a5cc0" stroke-width="1.5"/>
  <path d="M760,185 l8,-11 h84 l8,11 l-8,11 h-84 z" fill="none" stroke="#8a5cc0" stroke-width="1.5"/>
  <text x="810" y="200" text-anchor="middle" class="val">DMA addr</text>
  <path d="M880,185 l8,-11 h84 l8,11 l-8,11 h-84 z" fill="none" stroke="#8a5cc0" stroke-width="1.5"/>
  <text x="930" y="200" text-anchor="middle" class="val">CPU addr</text>
  <line x1="980" y1="196" x2="1190" y2="196" stroke="#8a5cc0" stroke-width="1.5"/>

  <text x="12" y="242" class="sig">hreadyout (mem)</text>
  <line x1="230" y1="224" x2="1190" y2="224" stroke="#2f8f80" stroke-width="2"/>
  <text x="630" y="250" text-anchor="middle" class="note">HIGH for the entire trace — the memory never inserts a wait-state, in either case</text>

  <text x="12" y="300" class="sig">cpu hready</text>
  <path d="M230,282 h470 v0" fill="none" stroke="#cf5b43" stroke-width="1.7"/>
  <line x1="230" y1="282" x2="700" y2="282" stroke="#cf5b43" stroke-width="1.7"/>
  <path d="M700,282 h60 v20 h120 v-20 h310" fill="none" stroke="#cf5b43" stroke-width="1.7"/>
  <text x="820" y="318" text-anchor="middle" class="note">CPU gated LOW by the interconnect while the DMA holds the grant</text>

  <text x="12" y="360" class="sig">hrdata</text>
  <line x1="230" y1="362" x2="350" y2="362" stroke="#8a5cc0" stroke-width="1.5"/>
  <path d="M350,351 l8,-11 h84 l8,11 l-8,11 h-84 z" fill="none" stroke="#8a5cc0" stroke-width="1.5"/>
  <text x="400" y="366" text-anchor="middle" class="val">instr word</text>
  <line x1="450" y1="362" x2="820" y2="362" stroke="#8a5cc0" stroke-width="1.5"/>
  <path d="M820,351 l8,-11 h84 l8,11 l-8,11 h-84 z" fill="none" stroke="#8a5cc0" stroke-width="1.5"/>
  <text x="870" y="366" text-anchor="middle" class="val">DMA data</text>
  <path d="M940,351 l8,-11 h84 l8,11 l-8,11 h-84 z" fill="none" stroke="#8a5cc0" stroke-width="1.5"/>
  <text x="990" y="366" text-anchor="middle" class="val">CPU data</text>
  <line x1="1040" y1="362" x2="1190" y2="362" stroke="#8a5cc0" stroke-width="1.5"/>

  <text x="455" y="418" text-anchor="middle" class="note">Address phase → data phase; array read (~2.8 ns) fits one 5 ns cycle.</text>
  <text x="950" y="418" text-anchor="middle" class="note">Two sequential single transactions reach the memory. Bank index is irrelevant to this.</text>
  <text x="630" y="488" text-anchor="middle" class="note">Contention is a bus-grant effect, not a memory effect: the CPU waits for the arbiter, never for the array.</text>
  <text x="630" y="514" text-anchor="middle" class="note" font-style="italic" fill="#808080">Purple = address/data · Teal = memory ready (always high) · Coral = interconnect grant / gated master ready. Editable source: GARUDA_MEM_Timing.svg</text>
</svg>
