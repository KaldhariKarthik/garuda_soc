<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#444"/>
    </marker>
    <style>
      .tt{font-size:12.5px;font-family:Consolas,monospace;fill:#1f1f1f}
      .sm{font-size:11.5px;fill:#444}
      .bt{font-size:14px;font-weight:bold;fill:#1f1f1f}
      .title{font-size:17px;font-weight:bold;fill:#1f1f1f}
    </style>
  </defs>
  <text x="600" y="30" text-anchor="middle" class="title">GARUDA Data SRAM — Bank Decode (one transaction per cycle, no memory-side arbiter)</text>

  <rect x="180" y="56" width="840" height="72" rx="8" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
  <text x="600" y="80" text-anchor="middle" class="bt">HADDR decode within the DSRAM region</text>
  <text x="600" y="102" text-anchor="middle" class="tt">[27:16] must be 0 (depth check) · [15:14] bank · [13:2] word · [1:0] byte lane</text>
  <text x="600" y="120" text-anchor="middle" class="sm">4096 words × 32 bits per bank = 16 KB per bank; 4 banks = 64 KB total</text>

  <!-- upstream -->
  <rect x="40" y="200" width="250" height="118" rx="8" fill="#f7d9d2" stroke="#cf5b43" stroke-width="2"/>
  <text x="165" y="226" text-anchor="middle" class="bt">Block 6 Interconnect</text>
  <text x="165" y="248" text-anchor="middle" class="sm">arbitrates CPU D-Port / DMA /</text>
  <text x="165" y="265" text-anchor="middle" class="sm">I-Port; DMA has priority</text>
  <text x="165" y="288" text-anchor="middle" class="sm">un-gates EXACTLY ONE master</text>
  <text x="165" y="307" text-anchor="middle" class="tt">→ one transaction</text>

  <text x="165" y="345" text-anchor="middle" class="sm">CPU/DMA contention is resolved</text>
  <text x="165" y="362" text-anchor="middle" class="sm">here, upstream of the memory</text>

  <!-- single bundle -->
  <rect x="330" y="216" width="190" height="86" rx="8" fill="#e4d5f5" stroke="#8a5cc0" stroke-width="2"/>
  <text x="425" y="242" text-anchor="middle" class="bt">S2 AHB slave</text>
  <text x="425" y="262" text-anchor="middle" class="sm">one shared bundle</text>
  <text x="425" y="280" text-anchor="middle" class="tt">hsel_s2 / haddr /</text>
  <text x="425" y="296" text-anchor="middle" class="tt">htrans / hwrite</text>

  <rect x="560" y="216" width="150" height="86" rx="8" fill="#f7d9d2" stroke="#cf5b43" stroke-width="2"/>
  <text x="635" y="248" text-anchor="middle" class="bt">Bank decode</text>
  <text x="635" y="270" text-anchor="middle" class="tt">HADDR[15:14]</text>
  <text x="635" y="290" text-anchor="middle" class="sm">activates ONE bank</text>

  <line x1="290" y1="259" x2="326" y2="259" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="520" y1="259" x2="556" y2="259" stroke="#444" stroke-width="2" marker-end="url(#a)"/>

  <!-- banks -->
  <g>
    <rect x="750" y="168" width="190" height="48" rx="6" fill="#bfe3dd" stroke="#2f8f80" stroke-width="2"/>
    <text x="845" y="188" text-anchor="middle" class="bt" font-size="13">Bank 0 — Sensor DMA</text>
    <text x="845" y="206" text-anchor="middle" class="sm">4096 × 32, single-port 6T</text>
    <rect x="750" y="228" width="190" height="48" rx="6" fill="#bfe3dd" stroke="#2f8f80" stroke-width="2"/>
    <text x="845" y="248" text-anchor="middle" class="bt" font-size="13">Bank 1 — EKF</text>
    <text x="845" y="266" text-anchor="middle" class="sm">4096 × 32, single-port 6T</text>
    <rect x="750" y="288" width="190" height="48" rx="6" fill="#bfe3dd" stroke="#2f8f80" stroke-width="2"/>
    <text x="845" y="308" text-anchor="middle" class="bt" font-size="13">Bank 2 — APF/comms</text>
    <text x="845" y="326" text-anchor="middle" class="sm">4096 × 32, single-port 6T</text>
    <rect x="750" y="348" width="190" height="48" rx="6" fill="#bfe3dd" stroke="#2f8f80" stroke-width="2"/>
    <text x="845" y="368" text-anchor="middle" class="bt" font-size="13">Bank 3 — FreeRTOS</text>
    <text x="845" y="386" text-anchor="middle" class="sm">4096 × 32, single-port 6T</text>
  </g>
  <line x1="710" y1="250" x2="746" y2="196" stroke="#444" stroke-width="1.7" marker-end="url(#a)"/>
  <line x1="710" y1="256" x2="746" y2="250" stroke="#444" stroke-width="1.7" marker-end="url(#a)"/>
  <line x1="710" y1="266" x2="746" y2="310" stroke="#444" stroke-width="1.7" marker-end="url(#a)"/>
  <line x1="710" y1="272" x2="746" y2="368" stroke="#444" stroke-width="1.7" marker-end="url(#a)"/>

  <rect x="990" y="228" width="160" height="108" rx="8" fill="#f7d9d2" stroke="#cf5b43" stroke-width="2"/>
  <text x="1070" y="262" text-anchor="middle" class="bt">Read Mux</text>
  <text x="1070" y="284" text-anchor="middle" class="sm">selects addressed</text>
  <text x="1070" y="301" text-anchor="middle" class="sm">bank's word; zero</text>
  <text x="1070" y="318" text-anchor="middle" class="sm">if out-of-depth</text>
  <line x1="940" y1="282" x2="986" y2="282" stroke="#444" stroke-width="2" marker-end="url(#a)"/>

  <rect x="180" y="440" width="840" height="96" rx="8" fill="#eef6f5" stroke="#2f8f80" stroke-width="2"/>
  <text x="600" y="466" text-anchor="middle" class="bt">Why bank, if there is no concurrency to win?</text>
  <text x="600" y="490" text-anchor="middle" class="sm">Only the addressed 16 KB bank is activated per access instead of a full 64 KB array — roughly 4× lower dynamic</text>
  <text x="600" y="508" text-anchor="middle" class="sm">energy per access, shorter bit lines, faster array read (keeps the ~2.8 ns path inside the 5 ns cycle), and four</text>
  <text x="600" y="526" text-anchor="middle" class="sm">smaller macros the floorplanner can place more freely. Banking is a physical optimisation, not a parallelism one.</text>

  <text x="600" y="580" text-anchor="middle" class="sm" font-style="italic" fill="#808080">Coral = upstream arbitration / decode / mux · Purple = AHB slave boundary · Teal = memory arrays. Editable source: GARUDA_MEM_BankArbiter.svg</text>
</svg>
