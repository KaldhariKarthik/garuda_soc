<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .sig{font-size:14px;font-family:Consolas,monospace;fill:#1f1f1f}
      .dom{font-size:13px;font-weight:bold;fill:#555}
      .title{font-size:17px;font-weight:bold;fill:#1f1f1f}
      .note{font-size:12px;fill:#555}
      .val{font-size:12px;font-family:Consolas,monospace;fill:#1f1f1f}
    </style>
  </defs>
  <text x="620" y="30" text-anchor="middle" class="title">GARUDA AHB-to-APB Bridge — Life of a CPU Write (single peripheral store)</text>

  <!-- geometry: label col 0..170, wave area 180..1200; hclk cell=42 (24 cells), pclk cell=84 -->
  <!-- vertical cycle guides for hclk -->
  <g stroke="#e2e2e2" stroke-width="1">
    <line x1="180" y1="60" x2="180" y2="470"/>
    <line x1="264" y1="60" x2="264" y2="470"/>
    <line x1="348" y1="60" x2="348" y2="470"/>
    <line x1="432" y1="60" x2="432" y2="470"/>
    <line x1="516" y1="60" x2="516" y2="470"/>
    <line x1="600" y1="60" x2="600" y2="470"/>
    <line x1="684" y1="60" x2="684" y2="470"/>
    <line x1="768" y1="60" x2="768" y2="470"/>
    <line x1="852" y1="60" x2="852" y2="470"/>
    <line x1="936" y1="60" x2="936" y2="470"/>
    <line x1="1020" y1="60" x2="1020" y2="470"/>
    <line x1="1104" y1="60" x2="1104" y2="470"/>
    <line x1="1188" y1="60" x2="1188" y2="470"/>
  </g>

  <!-- HCLK -->
  <text x="12" y="82" class="dom">hclk 200MHz</text>
  <path d="M180,90 h21 v-22 h42 v22 h42 v-22 h42 v22 h42 v-22 h42 v22 h42 v-22 h42 v22 h42 v-22 h42 v22 h42 v-22 h42 v22 h42 v-22 h42 v22 h42 v-22 h42 v22 h42 v-22 h42 v22 h42 v-22 h42 v22 h42 v-22 h42 v22 h21"
        fill="none" stroke="#8a5cc0" stroke-width="1.8"/>

  <!-- helper: rows -->
  <!-- HSEL -->
  <text x="12" y="140" class="sig">hsel_i</text>
  <path d="M180,148 h42 v-22 h84 v22 h852" fill="none" stroke="#2f8f80" stroke-width="1.8"/>
  <!-- HADDR/HWDATA -->
  <text x="12" y="185" class="sig">haddr/hwdata</text>
  <path d="M180,193 h42 l8,-11 h68 l8,11 M306,182 h0" fill="none" stroke="#8a5cc0" stroke-width="1.6"/>
  <path d="M222,182 h84 M222,182 l-8,11 l8,11 M306,182 l8,11 l-8,11" fill="none" stroke="#8a5cc0" stroke-width="1.6"/>
  <text x="264" y="178" text-anchor="middle" class="val">valid</text>
  <line x1="180" y1="204" x2="222" y2="204" stroke="#8a5cc0" stroke-width="1.6"/>
  <line x1="306" y1="204" x2="1188" y2="204" stroke="#8a5cc0" stroke-width="1.6"/>

  <!-- HREADY_o -->
  <text x="12" y="240" class="sig">hready_o</text>
  <path d="M180,226 h42 v22 h672 v-22 h252" fill="none" stroke="#2f8f80" stroke-width="1.8"/>
  <text x="560" y="264" text-anchor="middle" class="note">held LOW while the APB access completes across the CDC (wait-states inserted here)</text>

  <!-- req_toggle -->
  <text x="12" y="300" class="sig">req_toggle</text>
  <path d="M180,308 h64 v-22 h944" fill="none" stroke="#cf5b43" stroke-width="1.8"/>

  <!-- PCLK -->
  <text x="12" y="352" class="dom">pclk 100MHz</text>
  <path d="M180,360 h42 v-22 h84 v22 h84 v-22 h84 v22 h84 v-22 h84 v22 h84 v-22 h84 v22 h84 v-22 h84 v22 h42"
        fill="none" stroke="#8a5cc0" stroke-width="1.8"/>

  <!-- PSEL -->
  <text x="12" y="405" class="sig">psel_o</text>
  <path d="M180,413 h180 v-22 h252 v22 h576" fill="none" stroke="#2f8f80" stroke-width="1.8"/>
  <text x="486" y="386" text-anchor="middle" class="val">SETUP + ACCESS</text>

  <!-- PENABLE -->
  <text x="12" y="447" class="sig">penable_o</text>
  <path d="M180,455 h360 v-22 h72 v22 h576" fill="none" stroke="#cf5b43" stroke-width="1.8"/>

  <!-- PREADY -->
  <text x="12" y="489" class="sig">pready_i</text>
  <path d="M180,497 h444 v-22 h72 v22 h492" fill="none" stroke="#2f8f80" stroke-width="1.8"/>

  <!-- annotation braces -->
  <text x="243" y="527" text-anchor="middle" class="note">AHB addr phase</text>
  <text x="486" y="527" text-anchor="middle" class="note">APB SETUP</text>
  <text x="570" y="543" text-anchor="middle" class="note">APB ACCESS (PENABLE, PREADY)</text>
  <text x="1000" y="527" text-anchor="middle" class="note">ack crosses back → HREADY pulses high, write retires</text>

  <text x="620" y="556" text-anchor="middle" class="note" font-style="italic" fill="#808080">Illustrative cycle counts; APB access is 2 pclk cycles + CDC synchroniser latency. Editable source: GARUDA_Bridge_Timing.svg</text>
</svg>
