<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#444"/>
    </marker>
    <style>
      .st{font-size:14px;font-weight:bold;fill:#12433a}
      .stp{font-size:14px;font-weight:bold;fill:#4a2d6b}
      .ste{font-size:14px;font-weight:bold;fill:#8a2d20}
      .cond{font-size:11.5px;fill:#333}
      .title{font-size:17px;font-weight:bold;fill:#1f1f1f}
      .dom{font-size:13px;font-weight:bold;fill:#555}
      .out{font-size:11px;fill:#555;font-family:Consolas,monospace}
    </style>
  </defs>
  <text x="620" y="30" text-anchor="middle" class="title">GARUDA AHB-to-APB Bridge — Two-Sided Handshake FSM (explicit capture &amp; two-cycle ERROR)</text>
  <rect x="20" y="56" width="1200" height="330" fill="#eef6f5" stroke="#a9d3cd" stroke-dasharray="6 4"/>
  <text x="46" y="78" class="dom">hclk side (200 MHz) — AHB slave sequencer</text>
  <rect x="20" y="410" width="1200" height="228" fill="#f4f0fb" stroke="#c9b8e8" stroke-dasharray="6 4"/>
  <text x="46" y="432" class="dom">pclk side (100 MHz) — APB access sequencer</text>

  <ellipse cx="110" cy="150" rx="62" ry="38" fill="#bfe3dd" stroke="#2f8f80" stroke-width="2"/>
  <text x="110" y="150" text-anchor="middle" class="st">H_IDLE</text>
  <text x="110" y="167" text-anchor="middle" class="out">rdyout=1</text>
  <ellipse cx="330" cy="150" rx="66" ry="38" fill="#bfe3dd" stroke="#2f8f80" stroke-width="2"/>
  <text x="330" y="147" text-anchor="middle" class="st">H_CAPTURE</text>
  <text x="330" y="165" text-anchor="middle" class="out">rdyout=0</text>
  <ellipse cx="580" cy="150" rx="72" ry="38" fill="#bfe3dd" stroke="#2f8f80" stroke-width="2"/>
  <text x="580" y="147" text-anchor="middle" class="st">H_WAIT_ACK</text>
  <text x="580" y="165" text-anchor="middle" class="out">rdyout=0</text>
  <ellipse cx="850" cy="150" rx="74" ry="38" fill="#bfe3dd" stroke="#2f8f80" stroke-width="2"/>
  <text x="850" y="147" text-anchor="middle" class="st">H_RESP_OKAY</text>
  <text x="850" y="165" text-anchor="middle" class="out">rdyout=1 OKAY</text>
  <ellipse cx="1080" cy="290" rx="66" ry="36" fill="#f6d3cc" stroke="#cf5b43" stroke-width="2"/>
  <text x="1080" y="288" text-anchor="middle" class="ste">H_ERROR_1</text>
  <text x="1080" y="305" text-anchor="middle" class="out">rdyout=0 ERR</text>
  <ellipse cx="850" cy="290" rx="66" ry="36" fill="#f6d3cc" stroke="#cf5b43" stroke-width="2"/>
  <text x="850" y="288" text-anchor="middle" class="ste">H_ERROR_2</text>
  <text x="850" y="305" text-anchor="middle" class="out">rdyout=1 ERR</text>

  <line x1="172" y1="150" x2="262" y2="150" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="217" y="120" text-anchor="middle" class="cond">hsel &amp; htrans[1]</text>
  <text x="217" y="133" text-anchor="middle" class="cond">&amp; hready_i</text>
  <text x="217" y="178" text-anchor="middle" class="cond">latch addr/ctl</text>
  <line x1="396" y1="150" x2="506" y2="150" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="451" y="126" text-anchor="middle" class="cond">latch wdata (wr);</text>
  <text x="451" y="178" text-anchor="middle" class="cond">flip req_toggle</text>
  <path d="M556 116 Q580 82 604 116" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="580" y="76" text-anchor="middle" class="cond">ack not seen: hold</text>
  <line x1="652" y1="150" x2="774" y2="150" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="713" y="132" text-anchor="middle" class="cond">ack, err=0</text>
  <path d="M628 178 Q900 250 1016 285" fill="none" stroke="#cf5b43" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="870" y="236" text-anchor="middle" class="cond" fill="#8a2d20">ack, err=1</text>
  <line x1="1014" y1="290" x2="918" y2="290" stroke="#cf5b43" stroke-width="2" marker-end="url(#a)"/>
  <text x="966" y="278" text-anchor="middle" class="cond" fill="#8a2d20">next cycle</text>
  <path d="M828 186 Q700 240 118 190" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="470" y="238" text-anchor="middle" class="cond">drive HRDATA (read) → H_IDLE</text>
  <path d="M792 314 Q400 372 112 190" fill="none" stroke="#cf5b43" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="430" y="360" text-anchor="middle" class="cond" fill="#8a2d20">→ H_IDLE</text>

  <ellipse cx="200" cy="530" rx="66" ry="36" fill="#e4d5f5" stroke="#8a5cc0" stroke-width="2"/>
  <text x="200" y="535" text-anchor="middle" class="stp">P_IDLE</text>
  <ellipse cx="520" cy="530" rx="68" ry="36" fill="#e4d5f5" stroke="#8a5cc0" stroke-width="2"/>
  <text x="520" y="528" text-anchor="middle" class="stp">P_SETUP</text>
  <text x="520" y="546" text-anchor="middle" class="out">PSEL=1 EN=0</text>
  <ellipse cx="860" cy="530" rx="72" ry="36" fill="#e4d5f5" stroke="#8a5cc0" stroke-width="2"/>
  <text x="860" y="528" text-anchor="middle" class="stp">P_ACCESS</text>
  <text x="860" y="546" text-anchor="middle" class="out">PSEL=1 EN=1</text>
  <line x1="266" y1="530" x2="450" y2="530" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="358" y="516" text-anchor="middle" class="cond">req_sync edge:</text>
  <text x="358" y="554" text-anchor="middle" class="cond">read payload</text>
  <line x1="588" y1="530" x2="786" y2="530" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="687" y="518" text-anchor="middle" class="cond">next pclk edge</text>
  <path d="M836 566 Q860 606 884 566" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="860" y="602" text-anchor="middle" class="cond">PREADY=0: hold</text>
  <path d="M842 496 Q800 456 300 468 Q220 474 206 494" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="520" y="460" text-anchor="middle" class="cond">PREADY=1: latch prdata/pslverr, flip ack_toggle → P_IDLE</text>
  <text x="620" y="628" text-anchor="middle" class="cond" font-style="italic" fill="#808080">Teal = hclk states · Coral = two-cycle ERROR states · Purple = pclk states. rdyout = hreadyout_o. Editable source: GARUDA_Bridge_FSM.svg</text>
</svg>
