<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#444"/>
    </marker>
    <style>
      .lbl{font-size:14px;fill:#1f1f1f}
      .sm{font-size:12px;fill:#333}
      .tt{font-size:12.5px;font-family:Consolas,monospace;fill:#1f1f1f}
      .title{font-size:17px;font-weight:bold;fill:#1f1f1f}
      .bt{font-size:14.5px;font-weight:bold;fill:#1f1f1f}
    </style>
  </defs>

  <text x="600" y="34" text-anchor="middle" class="title">GARUDA CLIC (Block 16) — Top-Level Structure</text>

  <!-- APB config side -->
  <rect x="30" y="70" width="180" height="120" rx="8" fill="#e4d5f5" stroke="#8a5cc0" stroke-width="2"/>
  <text x="120" y="98" text-anchor="middle" class="bt">APB Slave I/F</text>
  <text x="120" y="118" text-anchor="middle" class="sm">config @ pclk</text>
  <text x="120" y="140" text-anchor="middle" class="tt">clicintip/ie/</text>
  <text x="120" y="158" text-anchor="middle" class="tt">attr/ctl regs</text>
  <text x="120" y="178" text-anchor="middle" class="tt">mintthresh</text>

  <!-- interrupt sources in -->
  <rect x="30" y="230" width="180" height="470" rx="8" fill="#f7d4e4" stroke="#c14e86" stroke-width="2"/>
  <text x="120" y="258" text-anchor="middle" class="bt">Interrupt Sources</text>
  <text x="120" y="276" text-anchor="middle" class="sm">(up to 32 lines in)</text>
  <text x="120" y="302" text-anchor="middle" class="tt">dma_irq[5:0]</text>
  <text x="120" y="320" text-anchor="middle" class="tt">dma_err[5:0]</text>
  <text x="120" y="342" text-anchor="middle" class="tt">spi/i2c/uart</text>
  <text x="120" y="360" text-anchor="middle" class="tt">pwm/gpio irq</text>
  <text x="120" y="382" text-anchor="middle" class="tt">systmr/wdt</text>
  <text x="120" y="400" text-anchor="middle" class="tt">gpt/pwmtmr</text>
  <text x="120" y="428" text-anchor="middle" class="sm">level or edge,</text>
  <text x="120" y="446" text-anchor="middle" class="sm">per source (attr)</text>

  <!-- per-source conditioning -->
  <rect x="270" y="230" width="230" height="240" rx="8" fill="#f7d9d2" stroke="#cf5b43" stroke-width="2"/>
  <text x="385" y="258" text-anchor="middle" class="bt">Per-Source Conditioning</text>
  <text x="385" y="284" text-anchor="middle" class="sm">edge detect / level pass</text>
  <text x="385" y="304" text-anchor="middle" class="sm">(clicintattr.trig)</text>
  <rect x="292" y="320" width="186" height="55" rx="6" fill="#bfe3dd" stroke="#2f8f80"/>
  <text x="385" y="342" text-anchor="middle" class="tt">clicintip[i]  (pending)</text>
  <text x="385" y="362" text-anchor="middle" class="sm">HW set / edge-latched</text>
  <rect x="292" y="392" width="186" height="55" rx="6" fill="#bfe3dd" stroke="#2f8f80"/>
  <text x="385" y="414" text-anchor="middle" class="tt">clicintie[i]  (enable)</text>
  <text x="385" y="434" text-anchor="middle" class="sm">software programmed</text>

  <!-- priority/level arbiter -->
  <rect x="555" y="230" width="240" height="240" rx="8" fill="#f7d9d2" stroke="#cf5b43" stroke-width="2"/>
  <text x="675" y="258" text-anchor="middle" class="bt">Max-Priority Arbiter</text>
  <text x="675" y="282" text-anchor="middle" class="sm">for each source i:</text>
  <text x="675" y="302" text-anchor="middle" class="sm">active = ip &amp; ie</text>
  <text x="675" y="322" text-anchor="middle" class="sm">key = {level, 255-id}</text>
  <text x="675" y="346" text-anchor="middle" class="sm">reduction tree →</text>
  <text x="675" y="366" text-anchor="middle" class="sm">winner id + level</text>
  <rect x="577" y="388" width="196" height="60" rx="6" fill="#bfe3dd" stroke="#2f8f80"/>
  <text x="675" y="410" text-anchor="middle" class="tt">winner_id / winner_lvl</text>
  <text x="675" y="430" text-anchor="middle" class="sm">registered</text>

  <!-- take-condition / vectoring -->
  <rect x="850" y="230" width="320" height="240" rx="8" fill="#f7d9d2" stroke="#cf5b43" stroke-width="2"/>
  <text x="1010" y="258" text-anchor="middle" class="bt">Take-Condition &amp; Vectoring</text>
  <text x="1010" y="284" text-anchor="middle" class="sm">winner_lvl &gt; mintthresh ?</text>
  <text x="1010" y="304" text-anchor="middle" class="sm">→ assert clic_irq_o</text>
  <text x="1010" y="326" text-anchor="middle" class="sm">present id / lvl / shv</text>
  <rect x="872" y="344" width="276" height="52" rx="6" fill="#e4d5f5" stroke="#8a5cc0"/>
  <text x="1010" y="365" text-anchor="middle" class="tt">shv lookup (clicintattr.shv)</text>
  <text x="1010" y="384" text-anchor="middle" class="sm">selective hardware vectoring flag</text>
  <rect x="872" y="408" width="276" height="46" rx="6" fill="#bfe3dd" stroke="#2f8f80"/>
  <text x="1010" y="436" text-anchor="middle" class="tt">ack capture → clear pending</text>

  <!-- CORE interface out -->
  <rect x="850" y="510" width="320" height="180" rx="8" fill="#e4d5f5" stroke="#8a5cc0" stroke-width="2"/>
  <text x="1010" y="538" text-anchor="middle" class="bt">Core Interface (frozen)</text>
  <text x="1010" y="562" text-anchor="middle" class="tt">clic_irq_o        → clic_irq_i</text>
  <text x="1010" y="582" text-anchor="middle" class="tt">clic_irq_id_o[11:0]</text>
  <text x="1010" y="602" text-anchor="middle" class="tt">clic_irq_lvl_o[7:0]</text>
  <text x="1010" y="622" text-anchor="middle" class="tt">clic_irq_shv_o</text>
  <text x="1010" y="646" text-anchor="middle" class="tt">clic_irq_ack_i ← core</text>
  <text x="1010" y="666" text-anchor="middle" class="tt">clic_irq_id_ack_i / mintthresh_i</text>

  <!-- flows -->
  <line x1="210" y1="330" x2="268" y2="330" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="350" x2="553" y2="350" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="795" y1="350" x2="848" y2="350" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1010" y1="470" x2="1010" y2="508" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <!-- ack back up -->
  <path d="M850 640 Q640 640 640 470" fill="none" stroke="#8a5cc0" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="640" y="660" text-anchor="middle" class="sm">clic_irq_ack_i / id_ack → clear taken source's pending</text>
  <!-- APB config to conditioning/threshold -->
  <line x1="120" y1="190" x2="120" y2="228" stroke="#8a5cc0" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <path d="M210 130 Q560 130 675 228" fill="none" stroke="#8a5cc0" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="560" y="120" text-anchor="middle" class="sm">ie / attr / priority / mintthresh writes (APB, pclk)</text>

  <!-- mintthresh from core -->
  <path d="M1148 655 Q1180 655 1180 300 Q1180 250 1050 240" fill="none" stroke="#8a5cc0" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <text x="600" y="730" text-anchor="middle" class="sm">Purple = bus/config &amp; core interface · Pink = interrupt source collection · Coral = arbitration/control · Teal = registered state. Editable source: GARUDA_CLIC_BlockDiagram.svg</text>
</svg>
