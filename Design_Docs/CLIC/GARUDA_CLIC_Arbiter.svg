<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#444"/>
    </marker>
    <style>
      .t{font-size:13px;fill:#1f1f1f}
      .tt{font-size:12.5px;font-family:Consolas,monospace;fill:#1f1f1f}
      .title{font-size:17px;font-weight:bold;fill:#1f1f1f}
      .bt{font-size:14px;font-weight:bold;fill:#1f1f1f}
      .sm{font-size:11.5px;fill:#444}
    </style>
  </defs>
  <text x="590" y="32" text-anchor="middle" class="title">GARUDA CLIC — Priority Resolution &amp; Take Condition (one source shown expanded)</text>

  <!-- per source row -->
  <rect x="40" y="70" width="150" height="120" rx="8" fill="#f7d4e4" stroke="#c14e86" stroke-width="2"/>
  <text x="115" y="96" text-anchor="middle" class="bt">Source i</text>
  <text x="115" y="120" text-anchor="middle" class="tt">irq_line[i]</text>
  <text x="115" y="142" text-anchor="middle" class="sm">level-sensitive</text>
  <text x="115" y="158" text-anchor="middle" class="sm">(e.g. dma_irq[n])</text>
  <text x="115" y="178" text-anchor="middle" class="sm">or edge (attr.trig)</text>

  <rect x="240" y="70" width="170" height="120" rx="8" fill="#bfe3dd" stroke="#2f8f80" stroke-width="2"/>
  <text x="325" y="96" text-anchor="middle" class="bt">Pending / Enable</text>
  <text x="325" y="120" text-anchor="middle" class="tt">ip[i] = line | latch</text>
  <text x="325" y="142" text-anchor="middle" class="tt">ie[i]  (SW)</text>
  <text x="325" y="166" text-anchor="middle" class="tt">prio[i][2:0]</text>
  <text x="325" y="183" text-anchor="middle" class="sm">3-bit level, 0..7</text>

  <rect x="460" y="70" width="180" height="120" rx="8" fill="#f7d9d2" stroke="#cf5b43" stroke-width="2"/>
  <text x="550" y="96" text-anchor="middle" class="bt">Active &amp; Key</text>
  <text x="550" y="122" text-anchor="middle" class="tt">active[i]=ip &amp; ie</text>
  <text x="550" y="148" text-anchor="middle" class="tt">key[i]=active ?</text>
  <text x="550" y="166" text-anchor="middle" class="tt">{prio,~id} : 0</text>
  <text x="550" y="184" text-anchor="middle" class="sm">id breaks level ties</text>

  <rect x="690" y="70" width="180" height="120" rx="8" fill="#f7d9d2" stroke="#cf5b43" stroke-width="2"/>
  <text x="780" y="96" text-anchor="middle" class="bt">Reduction Tree</text>
  <text x="780" y="122" text-anchor="middle" class="sm">pairwise max over</text>
  <text x="780" y="140" text-anchor="middle" class="sm">all N keys</text>
  <text x="780" y="164" text-anchor="middle" class="tt">→ winner key</text>
  <text x="780" y="184" text-anchor="middle" class="sm">combinational</text>

  <rect x="920" y="70" width="200" height="120" rx="8" fill="#bfe3dd" stroke="#2f8f80" stroke-width="2"/>
  <text x="1020" y="96" text-anchor="middle" class="bt">Winner Register</text>
  <text x="1020" y="122" text-anchor="middle" class="tt">winner_id[11:0]</text>
  <text x="1020" y="144" text-anchor="middle" class="tt">winner_lvl[7:0]</text>
  <text x="1020" y="166" text-anchor="middle" class="tt">winner_shv</text>
  <text x="1020" y="184" text-anchor="middle" class="sm">clocked, glitch-free out</text>

  <line x1="190" y1="130" x2="238" y2="130" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="410" y1="130" x2="458" y2="130" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="640" y1="130" x2="688" y2="130" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="870" y1="130" x2="918" y2="130" stroke="#444" stroke-width="2" marker-end="url(#a)"/>

  <text x="115" y="215" text-anchor="middle" class="sm">(× N sources, all in parallel)</text>

  <!-- take condition box -->
  <rect x="300" y="270" width="580" height="220" rx="10" fill="#fdf6e3" stroke="#b58900" stroke-width="2"/>
  <text x="590" y="298" text-anchor="middle" class="bt">Take Condition (evaluated in the CORE, driven by CLIC outputs — core §14.3)</text>
  <text x="330" y="330" class="t">Core takes the presented interrupt when ALL hold:</text>
  <text x="360" y="358" class="tt">1.  clic_irq_i = 1        (a source is active &amp; enabled)</text>
  <text x="360" y="382" class="tt">2.  mstatus.MIE = 1       (global interrupts enabled)</text>
  <text x="360" y="406" class="tt">3.  clic_irq_lvl_i  &gt;  mintthresh      (strictly greater)</text>
  <text x="360" y="430" class="tt">4.  clic_irq_lvl_i  &gt;  active handler level  (strictly &gt;)</text>
  <text x="330" y="462" class="sm">Both comparisons are strictly-greater-than: a source at exactly the threshold or the active</text>
  <text x="330" y="480" class="sm">handler level does NOT preempt. This is what bounds nesting depth to the 8 levels.</text>

  <line x1="1020" y1="190" x2="1020" y2="380" stroke="#444" stroke-width="2"/>
  <line x1="1020" y1="380" x2="882" y2="380" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="1050" y="290" text-anchor="middle" class="sm">clic_irq_o</text>
  <text x="1050" y="308" text-anchor="middle" class="sm">/id/lvl/shv</text>

  <!-- ack path -->
  <rect x="300" y="540" width="580" height="120" rx="10" fill="#e4d5f5" stroke="#8a5cc0" stroke-width="2"/>
  <text x="590" y="566" text-anchor="middle" class="bt">Acknowledge Handshake (core → CLIC)</text>
  <text x="330" y="594" class="tt">clic_irq_ack_i pulses 1 cycle, clic_irq_id_ack_i = taken id</text>
  <text x="330" y="618" class="t">CLIC clears that source's pending/edge state (level sources re-assert if the</text>
  <text x="330" y="636" class="t">line is still high — firmware must clear the source at the peripheral, e.g. DMA SR W1C).</text>

  <line x1="590" y1="490" x2="590" y2="538" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <path d="M300 600 Q30 600 25 300 Q25 245 236 130" fill="none" stroke="#8a5cc0" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="60" y="440" text-anchor="middle" class="sm">clears ip[i]</text>

  <text x="590" y="686" text-anchor="middle" class="sm" font-style="italic" fill="#808080">Pink = source · Teal = registered state · Coral = arbitration · Purple = core handshake · Amber = core-side take logic (shown for context). Editable source: GARUDA_CLIC_Arbiter.svg</text>
</svg>
