<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#444"/>
    </marker>
    <style>
      .lbl{font-size:15px;fill:#1f1f1f}
      .sm{font-size:12px;fill:#333}
      .tt{font-size:13px;font-family:Consolas,monospace;fill:#1f1f1f}
      .title{font-size:17px;font-weight:bold;fill:#1f1f1f}
      .dom{font-size:13px;font-weight:bold;fill:#555}
      .purple{fill:#e9ddf7}
    </style>
  </defs>

  <!-- domain bands -->
  <rect x="20" y="70" width="360" height="500" fill="#f4f0fb" stroke="#c9b8e8" stroke-dasharray="6 4"/>
  <rect x="800" y="70" width="360" height="500" fill="#eef6f5" stroke="#a9d3cd" stroke-dasharray="6 4"/>
  <text x="200" y="92" text-anchor="middle" class="dom">hclk domain — 200 MHz</text>
  <text x="980" y="92" text-anchor="middle" class="dom">pclk domain — 100 MHz</text>

  <text x="590" y="40" text-anchor="middle" class="title">GARUDA AHB-to-APB Bridge (Block 8) — Top-Level Structure</text>

  <!-- AHB slave interface -->
  <rect x="45" y="150" width="180" height="150" rx="8" fill="#e4d5f5" stroke="#8a5cc0" stroke-width="2"/>
  <text x="135" y="178" text-anchor="middle" class="title" font-size="15">AHB-Lite</text>
  <text x="135" y="198" text-anchor="middle" class="title" font-size="15">Slave I/F</text>
  <text x="135" y="222" text-anchor="middle" class="tt">hsel_i haddr_i</text>
  <text x="135" y="240" text-anchor="middle" class="tt">htrans_i hwrite_i</text>
  <text x="135" y="258" text-anchor="middle" class="tt">hsize_i hwdata_i</text>
  <text x="135" y="276" text-anchor="middle" class="tt">hrdata_o hready_o</text>
  <text x="135" y="294" text-anchor="middle" class="tt">hresp_o</text>

  <!-- Bridge FSM (hclk) -->
  <rect x="255" y="150" width="150" height="150" rx="8" fill="#bfe3dd" stroke="#2f8f80" stroke-width="2"/>
  <text x="330" y="182" text-anchor="middle" class="title" font-size="15">Bridge FSM</text>
  <text x="330" y="202" text-anchor="middle" class="sm">(hclk side)</text>
  <text x="330" y="228" text-anchor="middle" class="sm">IDLE · REQ ·</text>
  <text x="330" y="246" text-anchor="middle" class="sm">WAIT_ACK ·</text>
  <text x="330" y="264" text-anchor="middle" class="sm">SAMPLE ·</text>
  <text x="330" y="282" text-anchor="middle" class="sm">DONE</text>

  <!-- CDC handshake block spanning gap -->
  <rect x="430" y="120" width="320" height="220" rx="10" fill="#f7d9d2" stroke="#cf5b43" stroke-width="2"/>
  <text x="590" y="146" text-anchor="middle" class="title" font-size="15">CDC Handshake Bridge</text>
  <text x="590" y="166" text-anchor="middle" class="sm">(the only 200/100 MHz crossing in the SoC)</text>

  <rect x="455" y="185" width="120" height="55" rx="6" fill="#bfe3dd" stroke="#2f8f80"/>
  <text x="515" y="208" text-anchor="middle" class="tt">req_toggle</text>
  <text x="515" y="228" text-anchor="middle" class="sm">2-FF sync →pclk</text>

  <rect x="605" y="185" width="120" height="55" rx="6" fill="#bfe3dd" stroke="#2f8f80"/>
  <text x="665" y="208" text-anchor="middle" class="tt">ack_toggle</text>
  <text x="665" y="228" text-anchor="middle" class="sm">2-FF sync →hclk</text>

  <rect x="455" y="262" width="270" height="55" rx="6" fill="#e4d5f5" stroke="#8a5cc0"/>
  <text x="590" y="284" text-anchor="middle" class="sm">Payload registers (held stable, NOT synchronised)</text>
  <text x="590" y="303" text-anchor="middle" class="tt">addr / wdata / write / size · rdata / err</text>

  <!-- APB FSM (pclk) -->
  <rect x="820" y="150" width="150" height="150" rx="8" fill="#bfe3dd" stroke="#2f8f80" stroke-width="2"/>
  <text x="895" y="182" text-anchor="middle" class="title" font-size="15">APB FSM</text>
  <text x="895" y="202" text-anchor="middle" class="sm">(pclk side)</text>
  <text x="895" y="228" text-anchor="middle" class="sm">IDLE ·</text>
  <text x="895" y="246" text-anchor="middle" class="sm">SETUP ·</text>
  <text x="895" y="264" text-anchor="middle" class="sm">ACCESS</text>

  <!-- APB master interface -->
  <rect x="985" y="150" width="150" height="150" rx="8" fill="#e4d5f5" stroke="#8a5cc0" stroke-width="2"/>
  <text x="1060" y="178" text-anchor="middle" class="title" font-size="15">APB</text>
  <text x="1060" y="198" text-anchor="middle" class="title" font-size="15">Master I/F</text>
  <text x="1060" y="222" text-anchor="middle" class="tt">psel_o[n]</text>
  <text x="1060" y="240" text-anchor="middle" class="tt">penable_o</text>
  <text x="1060" y="258" text-anchor="middle" class="tt">paddr_o pwrite_o</text>
  <text x="1060" y="276" text-anchor="middle" class="tt">pwdata_o prdata_i</text>
  <text x="1060" y="294" text-anchor="middle" class="tt">pready_i pslverr_i</text>

  <!-- decoder -->
  <rect x="985" y="360" width="150" height="90" rx="8" fill="#f7d9d2" stroke="#cf5b43" stroke-width="2"/>
  <text x="1060" y="388" text-anchor="middle" class="title" font-size="14">APB Decoder</text>
  <text x="1060" y="410" text-anchor="middle" class="sm">PADDR[15:12]</text>
  <text x="1060" y="428" text-anchor="middle" class="sm">→ one-hot PSEL</text>
  <text x="1060" y="444" text-anchor="middle" class="sm">+ default ERROR</text>

  <!-- flows -->
  <line x1="225" y1="205" x2="253" y2="205" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="253" y1="245" x2="225" y2="245" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="405" y1="215" x2="453" y2="212" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="723" y1="212" x2="818" y2="215" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="818" y1="250" x2="727" y2="250" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="970" y1="205" x2="983" y2="205" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="983" y1="245" x2="970" y2="245" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1060" y1="300" x2="1060" y2="358" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- clock/reset inputs -->
  <text x="200" y="540" text-anchor="middle" class="tt">hclk_i · hreset_n_i</text>
  <text x="980" y="540" text-anchor="middle" class="tt">pclk_i · preset_n_i</text>
  <line x1="200" y1="525" x2="200" y2="302" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <line x1="980" y1="525" x2="980" y2="302" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <text x="590" y="600" text-anchor="middle" class="sm">Purple = bus interfaces / payload datapath · Teal = FSM / registered logic · Coral = control (CDC sequencing, decode, error). Editable source: GARUDA_Bridge_BlockDiagram.svg</text>
</svg>
